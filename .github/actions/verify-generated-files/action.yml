name: 'Verify Generated AI Config Files'
description: >-
  Verifies every VibeTags-generated AI config file exists, is non-empty, and
  contains the expected @AIAudit content. Shared by build-maven, build-gradle,
  and cross-platform so Maven/Gradle/OS output can never silently diverge.
inputs:
  working-directory:
    description: 'Directory containing the generated files (relative to GITHUB_WORKSPACE)'
    required: false
    default: 'example'

runs:
  using: 'composite'
  steps:
    - name: Verify Generated AI Config Files
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Checking generated files exist and contain content..."
        for f in \
          .cursorrules CLAUDE.md .aiexclude QWEN.md .qwenignore \
          .qwen/commands/refactor.md gemini_instructions.md \
          .github/copilot-instructions.md llms.txt llms-full.txt \
          CONVENTIONS.md .aiderignore .aider.conf.yml .gemini/styleguide.md \
          .greptile/rules.md .greptile/config.json greptile.json \
          .windsurfrules .rules .cody/config.json .codyignore .supermavenignore \
          replit.md .agents/skills/vibetags-guardrails/SKILL.md \
          .zencoder/rules/com-example-payment-PaymentProcessor.md \
          .cursor/rules/com-example-payment-PaymentProcessor.mdc \
          .cursor/rules/com-example-database-DatabaseConnector.mdc \
          .trae/rules/com-example-payment-PaymentProcessor.md \
          .roo/rules/com-example-payment-PaymentProcessor.md \
          .windsurf/rules/com-example-payment-PaymentProcessor.md \
          .continue/rules/com-example-payment-PaymentProcessor.md \
          .tabnine/guidelines/com-example-payment-PaymentProcessor.md \
          .amazonq/rules/com-example-payment-PaymentProcessor.md \
          .ai/rules/com-example-payment-PaymentProcessor.md \
          .pearai/rules/com-example-payment-PaymentProcessor.md \
          .mentatconfig.json sweep.yaml .plandex.yaml \
          .doubleignore .interpreter/profiles/vibetags.yaml .codeiumignore \
          GEMINI.md .antigravityignore \
          .repomixignore .gitingestignore .gptignore .ghostcoderignore .piecesignore .rooignore .continueignore .augmentignore .devinignore \
          .coderabbit.yaml .pr_agent.toml ellipsis.yaml .void/rules.md .roomodes \
          .clinerules .junie/guidelines.md .junie/AGENTS.md .idx/airules.md \
          CLAUDE.local.md .claude/skills/vibetags-guardrails/SKILL.md TESTING.md \
          .claude/rules/com-example-payment-PaymentProcessor.md \
          .github/instructions/com-example-payment-PaymentProcessor.instructions.md \
          .gemini/rules/com-example-payment-PaymentProcessor.md \
          .agents/rules/com-example-payment-PaymentProcessor.md \
          .aiassistant/rules/com-example-payment-PaymentProcessor.md \
          .augment/rules/com-example-payment-PaymentProcessor.md \
          .devin/rules/com-example-payment-PaymentProcessor.md \
          .devin/rules/+vibetags-safety.md .windsurf/rules/+vibetags-safety.md \
          .goosehints; do
          if [ ! -f "$f" ]; then echo "FAIL $f missing"; exit 1; fi
          if [ ! -s "$f" ]; then echo "FAIL $f empty"; exit 1; fi
          echo "OK $f"
        done
        echo "All generated files present and non-empty"

    - name: Verify @AIAudit Content
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Checking @AIAudit content in generated files..."
        grep -q "MANDATORY SECURITY AUDITS" .cursorrules || { echo "FAIL Cursor audit section missing"; exit 1; }
        echo "OK Cursor audit section"
        grep -q "audit_requirements" CLAUDE.md || { echo "FAIL Claude audit requirements missing"; exit 1; }
        echo "OK Claude audit requirements"
        grep -q "CONTINUOUS AUDIT REQUIREMENTS" gemini_instructions.md || { echo "FAIL Gemini audit requirements missing"; exit 1; }
        echo "OK Gemini audit requirements"
        # GEMINI.md renders the COLLAPSED shape here, because this example opts into both it
        # and .gemini/rules/ (tier-1 invariant 6). The audit bucket is a safety bucket, so it
        # stays inline, and since #721 under Gemini's own "CONTINUOUS AUDIT REQUIREMENTS"
        # heading, the one full mode prints, rather than the shared "MANDATORY SECURITY AUDITS".
        # Both halves are asserted: safety inline AND per-element detail moved out. Nothing
        # in CI pinned that pair before the example opted in.
        grep -q "CONTINUOUS AUDIT REQUIREMENTS" GEMINI.md || { echo "FAIL GEMINI.md audit requirements missing"; exit 1; }
        if grep -q "MANDATORY SECURITY AUDITS" GEMINI.md; then echo "FAIL GEMINI.md printed the shared audit heading instead of Gemini's (#721)"; exit 1; fi
        grep -q "Scoped Rules Index" GEMINI.md || { echo "FAIL GEMINI.md did not collapse to a scoped-rules index despite .gemini/rules being opted in"; exit 1; }
        grep -q "gemini/rules/" GEMINI.md || { echo "FAIL GEMINI.md index points at no scoped rule files"; exit 1; }
        echo "OK GEMINI.md audit requirements (collapsed, with scoped-rules index)"
        # AGENTS.md must be left untouched (sole-file fallback rule): it ships as a hand-authored
        # pointer alongside other AI config files, so VibeTags must not generate into it.
        if grep -q "VIBETAGS-START" AGENTS.md; then echo "FAIL AGENTS.md was generated — sole-file fallback rule broken"; exit 1; fi
        grep -q "VibeTags only auto-manages" AGENTS.md || { echo "FAIL AGENTS.md pointer was overwritten"; exit 1; }
        echo "OK AGENTS.md left untouched (sole-file fallback)"
        # .junie/AGENTS.md shares the root file's name and nothing else (#673): it is Junie's own
        # file, generated here while the root AGENTS.md above stays a pointer.
        grep -q "JetBrains Junie Guidelines" .junie/AGENTS.md || { echo "FAIL .junie/AGENTS.md is not the Junie rendering"; exit 1; }
        grep -q "com.example.payment.PaymentProcessor" .junie/AGENTS.md || { echo "FAIL .junie/AGENTS.md carries no locked element"; exit 1; }
        echo "OK .junie/AGENTS.md generated beside the untouched root AGENTS.md"
        grep -q "MANDATORY SECURITY AUDITS" QWEN.md || { echo "FAIL Qwen audit guardrails missing"; exit 1; }
        echo "OK Qwen audit guardrails"
        grep -q "Security Audit Requirements" .github/copilot-instructions.md || { echo "FAIL Copilot audit requirements missing"; exit 1; }
        echo "OK Copilot audit requirements"
        grep -q "Security Audit Requirements" llms.txt || { echo "FAIL llms.txt audit section missing"; exit 1; }
        echo "OK llms.txt audit section"
        grep -q "Mandatory Security Audit Requirements" llms-full.txt || { echo "FAIL llms-full.txt audit section missing"; exit 1; }
        echo "OK llms-full.txt audit section"
        grep -q "SECURITY AUDIT: com.example.database.DatabaseConnector" CONVENTIONS.md || { echo "FAIL Aider conventions audit section missing"; exit 1; }
        # A CONVENTIONS.md aider never reads was the defect this platform shipped with for
        # eleven releases: the file existing is not the property that matters, the read:
        # entry naming it is.
        grep -q "^  - CONVENTIONS.md$" .aider.conf.yml || { echo "FAIL .aider.conf.yml does not name CONVENTIONS.md, so aider never loads it"; exit 1; }
        grep -q "PaymentProcessor" .gemini/styleguide.md || { echo "FAIL Gemini Code Assist style guide carries no locked element"; exit 1; }
        grep -q "PaymentProcessor" .greptile/rules.md || { echo "FAIL Greptile rules.md carries no locked element"; exit 1; }
        # greptile.json is hand-configured in the example. Existing and non-empty were true of the
        # whole-file overwrite that erased the user's settings, so assert both halves: the hand-set
        # fields survived, and the guardrails arrived inside the shared values.
        grep -q '"fileChangeLimit": 100' greptile.json || { echo "FAIL greptile.json lost a hand-set field"; exit 1; }
        grep -q "This file is hand-configured" greptile.json || { echo "FAIL greptile.json lost the hand-written instructions"; exit 1; }
        grep -q "PaymentProcessor" greptile.json || { echo "FAIL greptile.json instructions carry no locked element"; exit 1; }
        grep -q 'GeneratedMetadata.java' greptile.json || { echo "FAIL greptile.json ignorePatterns carry no @AIIgnore glob"; exit 1; }
        # .greptile/config.json is hand-configured too, and VibeTags owns only a span in ignorePatterns.
        grep -q '"fileChangeLimit": 50' .greptile/config.json || { echo "FAIL .greptile/config.json lost a hand-set field"; exit 1; }
        grep -q 'guardrails live in rules.md' .greptile/config.json || { echo "FAIL .greptile/config.json lost its hand-written instructions"; exit 1; }
        grep -q 'target/\*\*' .greptile/config.json || { echo "FAIL .greptile/config.json lost the hand-written ignore pattern"; exit 1; }
        grep -q 'GeneratedMetadata.java' .greptile/config.json || { echo "FAIL .greptile/config.json ignorePatterns carry no @AIIgnore glob"; exit 1; }
        if grep -q 'PaymentProcessor' .greptile/config.json; then echo "FAIL .greptile/config.json carries guardrail prose, which belongs in rules.md"; exit 1; fi
        echo "OK Greptile rules.md, greptile.json and .greptile/config.json"
        # Devin Desktop, formerly Windsurf (#671). Both rule directories must carry the trigger front
        # matter the vendor documents; .windsurf/rules/ had Cursor's alwaysApply header until #683,
        # and a rule without a trigger has no documented activation mode. The ignore file needs a
        # glob: a header alone is what a missed AIIgnoreFormatter case leaves behind.
        [ "$(sed -n 2p .devin/rules/com-example-payment-PaymentProcessor.md)" = "trigger: glob" ] || { echo "FAIL .devin/rules rule lacks trigger: glob front matter"; exit 1; }
        [ "$(sed -n 2p .windsurf/rules/com-example-payment-PaymentProcessor.md)" = "trigger: glob" ] || { echo "FAIL .windsurf/rules rule lacks trigger: glob front matter"; exit 1; }
        if grep -l '^alwaysApply:' .windsurf/rules/*.md; then echo "FAIL .windsurf/rules carries Cursor's alwaysApply key"; exit 1; fi
        grep -q 'Tied to legacy database schema' .devin/rules/com-example-payment-PaymentProcessor.md || { echo "FAIL .devin/rules rule carries no locked reason"; exit 1; }
        grep -q 'GeneratedMetadata.java' .devinignore || { echo "FAIL .devinignore carries no @AIIgnore glob"; exit 1; }
        echo "OK Devin Desktop .devin/rules/ and .windsurf/rules/ front matter and .devinignore glob"
        # The always-on safety file in each rules directory (#684). This example also opts into
        # .windsurfrules, which Devin Desktop loads on every message and which keeps the safety tier
        # inline, so each safety file must be always_on and name it rather than repeat the tier.
        for f in .devin/rules/+vibetags-safety.md .windsurf/rules/+vibetags-safety.md; do
          [ "$(sed -n 2p "$f")" = "trigger: always_on" ] || { echo "FAIL $f lacks trigger: always_on front matter (#684)"; exit 1; }
          grep -q 'are in .windsurfrules' "$f" || { echo "FAIL $f does not name .windsurfrules as the safety tier's carrier (#684)"; exit 1; }
          if grep -q 'Tied to legacy database schema' "$f"; then echo "FAIL $f repeats the safety tier .windsurfrules already loads (#684)"; exit 1; fi
        done
        grep -q 'Tied to legacy database schema' .windsurfrules || { echo "FAIL .windsurfrules lost the inline locked reason the safety files defer to"; exit 1; }
        echo "OK Devin Desktop always-on safety files defer to .windsurfrules"
        echo "OK Aider conventions audit section"
        grep -q "Security audit required" sweep.yaml || { echo "FAIL sweep.yaml audit rule missing"; exit 1; }
        echo "OK sweep.yaml audit rule"
        grep -q '"audit"' .mentatconfig.json || { echo "FAIL .mentatconfig.json audit section missing"; exit 1; }
        echo "OK .mentatconfig.json audit section"
        grep -q "audit:" .plandex.yaml || { echo "FAIL .plandex.yaml audit section missing"; exit 1; }
        echo "OK .plandex.yaml audit section"
        grep -q "audit" .interpreter/profiles/vibetags.yaml || { echo "FAIL interpreter profile audit missing"; exit 1; }
        echo "OK Open Interpreter profile audit"
        # TESTING.md. Existing and non-empty is not the property that matters here: the file ships
        # as an empty opt-in placeholder and a build that never ran a test round leaves it that
        # way, which is indistinguishable from a build where routing silently stopped working.
        # So assert what is inside the markers, in both directions.
        grep -q "com.example.testing.PaymentFixturesTest" TESTING.md || { echo "FAIL TESTING.md carries no test-code guardrail, so the test round did not route (is the build running test-compile?)"; exit 1; }
        grep -q "VIBETAGS-START" TESTING.md || { echo "FAIL TESTING.md has no generated region"; exit 1; }
        if grep -q "recorded settlement responses" TESTING.md; then echo "FAIL a safety-tier guardrail was routed to TESTING.md"; exit 1; fi
        grep -q "recorded settlement responses" CLAUDE.md || { echo "FAIL the test class's @AILocked left CLAUDE.md, where safety guardrails must stay"; exit 1; }
        if grep -q "PaymentFixtures, never with the PaymentRequest" CLAUDE.md; then echo "FAIL a routed test guardrail is still in CLAUDE.md"; exit 1; fi
        grep -q "Guardrails for test code are in TESTING.md" CLAUDE.md || { echo "FAIL CLAUDE.md gave up test guardrails without pointing at TESTING.md"; exit 1; }
        echo "OK TESTING.md routing (moved, kept, and pointed at)"
        echo "All @AIAudit content verified"
