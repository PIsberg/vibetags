name: Build and Test

on:
  push:
    branches: [ main, master, 'feature/*', 'fix/*', 'chore/*', 'docs/*', 'ci/*', 'release/*' ]
  # Deliberately unfiltered: a pull request is a request to review a change, so it is tested
  # whichever branch it targets. Restricting this to main meant a stacked PR — one targeting the
  # branch it was built on, so its diff shows only its own work — ran no tests at all, and its PR
  # page was indistinguishable from one whose tests had passed.
  pull_request:

permissions:
  contents: read

jobs:
  build-maven:
    name: Maven Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25', '26' ]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags Annotations (Maven)
        # Same JDK-21-only split as the library step below, and for the same reason: PMD, CPD
        # and SpotBugs read source and bytecode, so repeating them per matrix JDK buys nothing.
        run: |
          cd vibetags-annotations
          if [ "${{ matrix.java }}" = "21" ]; then
            mvn install -B
          else
            mvn install -B -Dmaven.pmd.skip=true -Dspotbugs.skip=true
          fi

      - name: Build VibeTags Library (Maven)
        # PMD, SpotBugs and CPD are JDK-independent source/bytecode analysis, so run them
        # once (on JDK 21) instead of repeating identical work on every matrix JDK. Error Prone
        # stays on every JDK — it is a compiler plugin and is genuinely JDK-sensitive (see the
        # JDK 26 UnsafeFinalization workaround in vibetags/pom.xml). -Dmaven.pmd.skip also skips CPD.
        run: |
          cd vibetags
          if [ "${{ matrix.java }}" = "21" ]; then
            mvn clean install -B
          else
            mvn clean install -B -Dmaven.pmd.skip=true -Dspotbugs.skip=true
          fi

      - name: Install VibeTags BOM (Maven)
        run: |
          cd vibetags-bom
          mvn install -B

      # After the BOM: the CLI consumes vibetags-processor as a library, so it needs the
      # artifacts this run just installed, and its 15 tests are the gate on init/doctor.
      - name: Build VibeTags CLI (Maven)
        # Same JDK-21-only split as the library step, for the same reason.
        run: |
          cd vibetags-cli
          if [ "${{ matrix.java }}" = "21" ]; then
            mvn clean install -B
          else
            mvn clean install -B -Dmaven.pmd.skip=true -Dspotbugs.skip=true
          fi

      # The repo dogfoods its own guardrails but never verified them, so the committed
      # CLAUDE.md / GEMINI.md / .claudeignore / .claude/rules could drift from what the
      # processor writes and nothing said so — which is exactly what happened, and is only
      # visible to whoever next runs -Pself-annotate by hand. Check mode exists for precisely
      # this and fails on any would-be write, so a stale committed guardrail is now a red
      # build. On JDK 21 only: it verifies file content, which is JDK-independent.
      - name: Verify VibeTags' Own Guardrails Are Current (self-check)
        if: matrix.java == '21'
        run: |
          cd vibetags
          mvn clean compile -B -Pself-annotate -Dvibetags.selfcheck=true

      - name: Reset AI Config Files (Maven)
        run: |
          cd examples/basic
          bash reset-ai-files.sh

      - name: Build Example Project (Maven)
        run: |
          cd examples/basic
          mvn clean compile -B -Dvibetags.log.path=../../vibetags.log

      - name: Verify The Example's Committed Guardrails Match Its Annotations
        run: |
          # The three reactors run check mode. examples/basic/ cannot: the step above empties its config
          # files and regenerates them, so check mode would compare the fresh tree against itself.
          # Comparing against git is the equivalent gate, and a slightly stronger one — it proves a
          # from-empty regeneration reproduces exactly what is committed. It fails when someone
          # edits an annotation here and forgets to commit the regenerated files, which until now
          # went unnoticed.
          if [ -n "$(git status --porcelain -- examples/basic/)" ]; then
            echo "::error::examples/basic/ guardrail files are out of date with its annotations."
            echo "Run: cd examples/basic && mvn clean compile   then commit the regenerated files."
            git status --porcelain -- examples/basic/
            git --no-pager diff -- examples/basic/
            exit 1
          fi
          echo "examples/basic/ regenerates byte-for-byte to the committed files."

      - name: Build Multi-Module Example (Maven reactor)
        run: |
          cd examples/multimodule
          mvn clean verify -B

      - name: Verify The Multi-Module Example's Committed Guardrails Match Its Annotations
        run: |
          # The gate examples/basic/ has had for a while, now that this reactor can pass it. It could not
          # before: .vibetags-locks recorded absolute source paths, so the file differed on every
          # runner and this check would have failed on every clean run.
          #
          # Issue #383 stayed invisible for exactly as long as nothing compared this reactor against
          # git. A module round was deleting 256 committed rule files mid-build and a later module
          # was putting them back, so the only trace was one warning in a 5000-line log.
          if [ -n "$(git status --porcelain -- examples/multimodule/)" ]; then
            echo "::error::examples/multimodule/ guardrail files are out of date with its annotations."
            echo "Run: cd examples/multimodule && mvn clean verify   then commit the regenerated files."
            git status --porcelain -- examples/multimodule/
            git --no-pager diff -- examples/multimodule/
            exit 1
          fi
          echo "examples/multimodule/ regenerates byte-for-byte to the committed files."

      - name: Verify Transitive Guardrails Propagate Through The Reactor
        run: |
          cd examples/multimodule
          # The manifest has to land in the module's own class output at a package-named path, or
          # nothing downstream can read it. javac's CLASS_PATH location skips archive directories
          # that are not valid package names, so META-INF/ is unreadable from an annotation
          # processor — this asserts the path that works, from the artifact that ships it.
          manifest=core/target/classes/vibetags/manifests/com.example.multimodule.core.json
          if [ ! -f "$manifest" ]; then
            echo "::error::core/ published no transitive manifest at $manifest"
            find core/target/classes -name '*.json' -print || true
            exit 1
          fi
          grep -q '"origin"' "$manifest" || { echo "::error::manifest carries no origin"; cat "$manifest"; exit 1; }
          echo "core/ published $manifest"

          # And the consuming modules have to show it. A reactor that publishes a manifest nobody
          # reads still builds, still regenerates byte-for-byte, and demonstrates nothing.
          for module in engine cli; do
            region=$(awk "/VIBETAGS-MODULE: $module /{f=1} f; /VIBETAGS-MODULE-END: $module /{f=0}" CLAUDE.md)
            if ! echo "$region" | grep -q 'Inherited Guardrails (dependencies)'; then
              echo "::error::$module imports com.example.multimodule.core but inherited nothing"
              echo "$region"
              exit 1
            fi
          done
          echo "engine/ and cli/ inherit core/'s package guardrails."

      - name: Verify Multi-Module Aggregation (issue #278)
        run: |
          cd examples/multimodule
          for token in "VIBETAGS-MODULE: core" "VIBETAGS-MODULE: engine" "VIBETAGS-MODULE: cli" \
                       "VIBETAGS-MODULE: showcase" \
                       "com.example.multimodule.core.IrNode" \
                       "com.example.multimodule.engine.LayoutEngine" \
                       "com.example.multimodule.cli.MultiModuleCli"; do
            grep -qF "$token" CLAUDE.md || { echo "MISSING in CLAUDE.md: $token"; exit 1; }
            grep -qF "$token" .cursorrules || { echo "MISSING in .cursorrules: $token"; exit 1; }
          done
          echo "All reactor modules present in merged guardrail files."

      - name: Verify Every Annotation Survives the Reactor Merge
        run: |
          cd examples/multimodule
          # annotations-showcase/ carries all 44 @AI* annotations, so the merged root must show all 44 of the
          # renderer's element buckets. A renderer that silently drops a family in the multi-module
          # path — as opposed to the single-module path examples/basic/ covers — fails here.
          declared=$(ls ../../vibetags-annotations/src/main/java/se/deversity/vibetags/annotations/*.java | wc -l)
          sections=$(grep -o '^  <[a-z_]*>' CLAUDE.md | sort -u | wc -l)
          if [ "$sections" -ne "$declared" ]; then
            echo "merged CLAUDE.md has $sections element sections for $declared annotations"
            grep -o '^  <[a-z_]*>' CLAUDE.md | sort -u
            exit 1
          fi
          echo "All $declared annotation families present in the merged reactor output."

      - name: Verify Every AI Service Is Generated in a Reactor
        run: |
          cd examples/multimodule
          # The reactor root opts into every non-granular service, so every renderer runs through
          # the sidecar merge — not just the three the hand-written modules happened to use.
          # (The four indexable granular directories are deliberately absent: co-activating them
          # collapses the aggregates, which is what examples/multimodule-indexed/ covers.)
          expected=50
          actual=$(grep 'Active services' vibetags.log | tail -1 | sed 's/.*services (\([0-9]*\)).*/\1/')
          if [ "$actual" != "$expected" ]; then
            echo "expected $expected active services in the reactor, got $actual"
            grep 'Active services' vibetags.log | tail -1
            exit 1
          fi
          # Spot-check that marker-based files from renderers with nothing else asserting them
          # really got written. (.codex/* is absent on purpose: Codex is dropped unless AGENTS.md is
          # the sole AI config file, which it is not here. JSON/TOML configs are whole-file
          # overwrites with no marker, so they are not in this list.)
          for f in GEMINI.md QWEN.md .windsurfrules .clinerules CONVENTIONS.md \
                   .junie/guidelines.md .void/rules.md sweep.yaml ellipsis.yaml .roomodes \
                   .qwen/commands/refactor.md llms-full.txt .vibetags-locks .aiexclude \
                   .pr_agent.toml .coderabbit.yaml; do
            test -s "$f" || { echo "reactor produced no content for: $f"; exit 1; }
            grep -qF "VIBETAGS" "$f" || { echo "no VibeTags block in: $f"; exit 1; }
          done
          # Granular directories are populated per class, not with a single file.
          test "$(ls -1 .kiro/steering/ | wc -l)" -gt 10 \
            || { echo "kiro granular directory not populated in the reactor"; exit 1; }
          echo "All $expected services active and generating in the reactor."

      - name: Verify The Committed Guardrails Match The Example's Annotations (check mode)
        run: |
          cd examples/multimodule
          # Check mode is what a consumer runs in CI: instead of regenerating, the processor fails
          # the build when a generated file no longer matches the annotations. Running it here does
          # two jobs. It exercises the feature end-to-end through a real reactor — the only test of
          # it outside the unit suite — and it guards this example, where editing an annotation and
          # forgetting to commit the regenerated file previously went unnoticed because CI only
          # ever ran a plain `compile`.
          #
          # It runs after the normal build above, so the tree is already regenerated: a failure
          # here means the committed files disagree with the committed annotations.
          mvn clean compile -B -Dvibetags.check=true

      - name: Verify Reactor YAML Is Readable By The Tools That Consume It
        run: |
          cd examples/multimodule
          # "The file exists and says VIBETAGS" is what the check above proves, and it is not
          # enough: the merge once stacked each module's whole document, so these files carried
          # their top-level key once per module. Strict parsers rejected them and lenient ones kept
          # only the last module, silently. Parse them here with duplicate keys forbidden, and
          # assert an element only one module declares is still reachable after the parse.
          python3 - <<'PY'
          import sys, yaml

          FILES = ["sweep.yaml", "ellipsis.yaml", ".coderabbit.yaml", ".plandex.yaml",
                   ".roomodes", ".interpreter/profiles/vibetags.yaml"]
          # Declared in exactly one module each, so their presence proves the merge kept them all.
          WITNESSES = {
              "cli": "com.example.multimodule.cli.MultiModuleCli",
              "core": "com.example.multimodule.core.IrNode",
              "showcase": "com.example.security.SecurityConfig",
          }

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen = set()
              for key_node, _ in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"duplicate top-level key {key!r}", key_node.start_mark)
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)

          Strict.construct_mapping = no_duplicates

          failed = False
          for path in FILES:
              text = open(path, encoding="utf-8").read()
              try:
                  parsed = str(yaml.load(text, Loader=Strict))
              except Exception as e:
                  print(f"::error file={path}::not a valid YAML document: {e}")
                  failed = True
                  continue
              missing = [m for m, w in WITNESSES.items() if w not in parsed]
              if missing:
                  print(f"::error file={path}::merged away the guardrails of module(s): {missing}")
                  failed = True
              else:
                  print(f"{path}: parses strictly, all {len(WITNESSES)} modules survive")
          sys.exit(1 if failed else 0)
          PY


      - name: Verify Per-Module (nested) Output
        run: |
          cd examples/multimodule
          # cli/ opts into its own CLAUDE.md, so it must carry ONLY cli's guardrails...
          grep -qF "com.example.multimodule.cli.MultiModuleCli" cli/CLAUDE.md \
            || { echo "MISSING in cli/CLAUDE.md: cli guardrail"; exit 1; }
          for foreign in "com.example.multimodule.core.IrNode" "com.example.multimodule.engine.LayoutEngine"; do
            if grep -qF "$foreign" cli/CLAUDE.md; then
              echo "LEAKED into cli/CLAUDE.md (should be module-scoped): $foreign"; exit 1
            fi
          done
          # ...and the reactor-root file is unchanged: still merges every module.
          grep -qF "com.example.multimodule.core.IrNode" CLAUDE.md \
            || { echo "root CLAUDE.md must still merge all modules"; exit 1; }
          echo "Per-module output is module-scoped; reactor root still merges all modules."

      - name: Verify Cross-Module Mirroring (issue #312)
        run: |
          cd examples/multimodule
          # tests/ has no @AI* annotations of its own; it opted in via .vibetags-mirror, so each
          # source module's scoped rules must be mirrored there under its own namespace.
          for f in mirrored-core-com-example-multimodule-core-IrNode.md \
                   mirrored-engine-com-example-multimodule-engine-LayoutEngine.md \
                   mirrored-cli-com-example-multimodule-cli-MultiModuleCli.md; do
            test -f "tests/.claude/rules/$f" || { echo "MISSING mirrored rule: $f"; exit 1; }
          done
          # A mirrored file carries the source rule verbatim, with the target's globs appended.
          grep -qF "Core IR node" tests/.claude/rules/mirrored-core-com-example-multimodule-core-IrNode.md \
            || { echo "mirrored rule lost the source module's guardrail"; exit 1; }
          grep -qF '"**/tests/src/test/java/**/*.java"' tests/.claude/rules/mirrored-core-com-example-multimodule-core-IrNode.md \
            || { echo "mirrored rule is not scoped to the target module's sources"; exit 1; }
          # Mirroring itself must still not put a module into the reactor root. tests/ does appear
          # there now, but for an unrelated reason: it imports com.example.multimodule.core, so it
          # inherits that package's published guardrails and genuinely has something to say. The
          # invariant being defended is that MIRRORING creates no region, so the check is that
          # tests/'s region contains ONLY inherited rules and none of its own element sections —
          # a mirrored rule reaching the root merge would show up as a populated section here.
          region=$(awk '/VIBETAGS-MODULE: tests /{f=1} f; /VIBETAGS-MODULE-END: tests /{f=0}' CLAUDE.md)
          if [ -n "$region" ]; then
            if ! echo "$region" | grep -q 'Inherited Guardrails (dependencies)'; then
              echo "tests/ has no annotations of its own, so the only thing that may put it in the"
              echo "root merge is an inherited rule — and its region carries none:"
              echo "$region"
              exit 1
            fi
            # Populated own-sections would mean a mirrored rule leaked into the aggregate.
            if echo "$region" | grep -E '^    <(file|element) ' >/dev/null; then
              echo "a mirrored rule must not reach the reactor root's aggregate:"
              echo "$region"
              exit 1
            fi
            echo "tests/ appears in the root merge with inherited rules only, as expected."
          fi
          echo "Sibling module rules mirrored into the centralised test module."

      - name: Verify Granular Role Files Merge Across Modules (issue #365)
        run: |
          cd examples/multimodule
          # .vibetags-roles routes core/, engine/ and cli/ into ONE root rule file, so all three
          # modules write the same path. Each compile used to replace it with its own classes
          # alone, and only the module that happened to compile last kept its guardrails.
          for dir in .kiro/steering .trae/rules .roo/rules .ai/rules .continue/rules \
                     .tabnine/guidelines .amazonq/rules .pearai/rules; do
            f="$dir/reactor-spine.md"
            test -f "$f" || { echo "MISSING role rule file: $f"; exit 1; }
            for token in "VIBETAGS-MODULE: core" "VIBETAGS-MODULE: engine" "VIBETAGS-MODULE: cli" \
                         "com.example.multimodule.core.IrNode" \
                         "com.example.multimodule.engine.LayoutEngine" \
                         "com.example.multimodule.cli.MultiModuleCli"; do
              grep -qF "$token" "$f" || { echo "MISSING in $f: $token"; exit 1; }
            done
          done
          # A class matching no role keeps its own per-class file — the merge must not eat that path.
          test -f .kiro/steering/com-example-security-SecurityConfig.md \
            || { echo "unrouted classes lost their per-class rule file"; exit 1; }
          # The report's second repro: `mvn -pl <one-module>` must leave the shared file byte-identical,
          # or an unrelated one-module edit produces a spurious diff in a generated file.
          before=$(md5sum .kiro/steering/reactor-spine.md | cut -d' ' -f1)
          mvn -B -pl core clean compile
          after=$(md5sum .kiro/steering/reactor-spine.md | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "a one-module rebuild rewrote the shared role file:"
            git --no-pager diff -- .kiro/steering/reactor-spine.md
            exit 1
          fi
          echo "Role files merge across all three modules and survive a one-module rebuild."

      - name: Build All-Tiers Example And Verify The Tier Split
        run: |
          cd examples/all-tiers
          mvn clean compile -B
          # Tier 1 must carry the six safety buckets inline and nothing verbose: a guardrail that
          # only loads once the agent opens the file it protects has become a comment, and a
          # verbose bucket inline is the always-loaded bloat the index exists to remove.
          for bucket in locked_files audit_requirements pii_guardrails core_elements \
                        ignored_elements security_elements; do
            grep -qF "<$bucket>" CLAUDE.md \
              || { echo "Tier 1 lost the safety bucket: $bucket"; exit 1; }
          done
          for bucket in contextual_instructions contract_signatures performance_constraints \
                        sanitization_elements observability_instrumentation; do
            if grep -qF "<$bucket>" CLAUDE.md; then
              echo "Tier 1 embedded a verbose bucket that belongs in Tier 3: $bucket"; exit 1
            fi
          done
          # Tier 1 points at both lower tiers, per module.
          for m in billing shipping; do
            grep -qF "VIBETAGS-MODULE: $m" CLAUDE.md || { echo "no Tier-1 region for $m"; exit 1; }
            grep -qF "$m/.claude/rules/" CLAUDE.md || { echo "Tier-1 pointer misses $m Tier 3"; exit 1; }
            grep -qF "$m/CLAUDE.md" CLAUDE.md || { echo "Tier-1 pointer misses $m Tier 2"; exit 1; }
          done
          # Tier 2 is a real boundary: neither module's file mentions the other.
          # `if grep` rather than `grep && {…}`: the steps run under `bash -e`, and a grep that
          # correctly finds nothing exits 1, which would fail the step on the passing case.
          if grep -q shipping billing/CLAUDE.md; then echo "Tier 2 billing leaks shipping"; exit 1; fi
          if grep -q billing shipping/CLAUDE.md; then echo "Tier 2 shipping leaks billing"; exit 1; fi
          # Tier 3 is role-grouped and auto-loading, and reaches parameter level — the finest
          # addressing VibeTags produces, and the one a hand-written rules file cannot express.
          for f in billing/.claude/rules/api-endpoints.md billing/.claude/rules/domain-model.md \
                   shipping/.claude/rules/label-printing.md; do
            test -s "$f" || { echo "missing role-grouped Tier-3 file: $f"; exit 1; }
            grep -q "^paths:" "$f" || { echo "$f has no paths: front-matter, so it never loads"; exit 1; }
          done
          grep -qF "renderInvoice(java.lang.String,java.lang.String)#customerNote" \
            billing/.claude/rules/api-endpoints.md \
            || { echo "no parameter-level guardrail generated"; exit 1; }
          echo "All three tiers and all four annotation levels verified."

      - name: Verify The All-Tiers Example's Committed Guardrails (check mode)
        run: |
          cd examples/all-tiers
          mvn clean compile -B -Dvibetags.check=true

      - name: Build Indexed Multi-Module Example (issue #295)
        run: |
          cd examples/multimodule-indexed
          mvn clean compile -B

      - name: Verify The Indexed Example's Committed Guardrails (check mode)
        run: |
          cd examples/multimodule-indexed
          # Runs after the build above, so the tree is already regenerated: a failure here means
          # the committed files disagree with the committed annotations.
          mvn clean compile -B -Dvibetags.check=true

      - name: Verify Indexed Root (issues #295, #319, #332)
        run: |
          cd examples/multimodule-indexed
          # Root CLAUDE.md is a lean INDEX: one pointer per module...
          for m in core app; do
            grep -qF "VIBETAGS-MODULE: $m" CLAUDE.md \
              || { echo "MISSING module pointer in indexed CLAUDE.md: $m"; exit 1; }
          done
          grep -qF "maintained in that module" CLAUDE.md \
            || { echo "indexed CLAUDE.md is not an index (no pointer text)"; exit 1; }
          # ...but the always-on SAFETY tier stays inline per module (#332). A guardrail that only
          # loads once the agent opens the file it protects has become a comment.
          grep -qF "com.example.indexed.core.DocumentModel" CLAUDE.md \
            || { echo "indexed CLAUDE.md must keep @AILocked inline"; exit 1; }
          grep -qF "com.example.indexed.app.DocumentService" CLAUDE.md \
            || { echo "indexed CLAUDE.md must keep @AIAudit inline"; exit 1; }
          # ...while the verbose tier is what the pointer replaces.
          if grep -qF "<contextual_instructions>" CLAUDE.md; then
            echo "indexed CLAUDE.md must NOT embed the verbose per-element buckets"; exit 1
          fi
          for token in "<contract_signatures>" "<pure_functions>" "<domain_model_elements>"; do
            if grep -qF "$token" CLAUDE.md; then
              echo "indexed CLAUDE.md must NOT embed the verbose tier: $token"; exit 1
            fi
          done
          # GEMINI.md has no scoped-rules feature here, so it still carries the full MERGED block.
          for fqn in "com.example.indexed.core.DocumentModel" "com.example.indexed.app.DocumentService"; do
            grep -qF "$fqn" GEMINI.md || { echo "MISSING in merged GEMINI.md: $fqn"; exit 1; }
          done
          grep -qF "CONTRACT-FROZEN SIGNATURES" GEMINI.md \
            || { echo "GEMINI.md must still carry the verbose tier"; exit 1; }
          # Copilot: aggregate AND granular directory live at the ROOT, not per module — the
          # combination that shipped broken in RC7 (#319). It must collapse to a scoped index...
          grep -qF "## Scoped Rules Index" .github/copilot-instructions.md \
            || { echo "indexed root did not collapse .github/copilot-instructions.md (#319)"; exit 1; }
          # ...and every module's scoped file must survive every other module's compile.
          for f in com-example-indexed-core-DocumentModel com-example-indexed-app-DocumentService; do
            test -f ".github/instructions/$f.instructions.md" \
              || { echo "MISSING shared granular file (cross-module cleanup regression): $f"; exit 1; }
          done
          # A module with nothing locked must not repeat an empty heading once per module.
          test "$(grep -c '^## Locked Files' .github/copilot-instructions.md)" = "1" \
            || { echo "empty Locked Files heading repeated per module (#319)"; exit 1; }
          # Tier-3 detail lives in per-module scoped rules, grouped by each module's .vibetags-roles.
          test -f core/.claude/rules/domain-model.md || { echo "MISSING core/.claude/rules/domain-model.md"; exit 1; }
          test -f app/.claude/rules/services.md || { echo "MISSING app/.claude/rules/services.md"; exit 1; }
          echo "Indexed root: safety inline, verbose indexed, Copilot collapsed, all modules' scoped files intact."
      # -Pe2e adds back the @Tag("e2e") classes that `mvn test` skips locally. The install
      # step above ran the fast tier; this is the only place the whole suite runs, so it is
      # not the redundant second pass it looks like.
      - name: Run Full Test Suite (VibeTags Library, incl. e2e)
        run: |
          cd vibetags
          mvn test -B -Pe2e

      - name: Verify Generated AI Config Files
        uses: ./.github/actions/verify-generated-files
        with:
          working-directory: examples/basic

      - name: Verify the Central deploy script reports failures
        if: matrix.java == '21'
        run: bash .github/scripts/deploy-to-central.test.sh

      - name: Upload coverage to Codecov
        if: matrix.java == '21'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: vibetags/target/site/jacoco/jacoco.xml
          flags: unittests
          fail_ci_if_error: false

      # A CI-only failure without its log is undiagnosable from a laptop. On any red run,
      # keep the diagnostic channel (vibetags.log) and the surefire reports as artifacts,
      # so the narrative of what the processor decided survives the runner.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-logs-maven-jdk${{ matrix.java }}
          path: |
            vibetags.log
            vibetags/vibetags.log
            examples/basic/vibetags.log
            vibetags/target/surefire-reports/
            vibetags-cli/target/surefire-reports/
          if-no-files-found: ignore

  cross-platform:
    name: Cross-Platform Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    # Path separators, line endings (CRLF) and the marker-aware writer are
    # OS-sensitive; the main matrix only runs on Linux. This job runs the
    # library's unit tests (self-contained, temp-dir based) on Windows and
    # macOS to catch platform-specific regressions in file handling.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags Annotations (Maven)
        run: |
          cd vibetags-annotations
          mvn install -B -q

      - name: Build VibeTags Library (Maven)
        run: |
          cd vibetags
          mvn clean install -B -q

      - name: Install VibeTags BOM (Maven)
        run: |
          cd vibetags-bom
          mvn install -B -q

      # The CLI's init/doctor are filesystem-heavy, which is exactly what varies by OS —
      # these legs are the only ones running its tests on Windows and macOS path behaviour.
      - name: Build VibeTags CLI (Maven)
        run: |
          cd vibetags-cli
          mvn clean install -B -q

      - name: Reset AI Config Files (Maven)
        run: |
          cd examples/basic
          bash reset-ai-files.sh

      - name: Build Example Project (Maven)
        run: |
          cd examples/basic
          mvn -B clean compile

      - name: Build Multi-Module Example (Maven reactor)
        run: |
          cd examples/multimodule
          mvn clean verify -B
          grep -qF "VIBETAGS-MODULE: core" CLAUDE.md
          grep -qF "VIBETAGS-MODULE: engine" CLAUDE.md
          grep -qF "VIBETAGS-MODULE: cli" CLAUDE.md

      # -Pe2e adds back the @Tag("e2e") classes that `mvn test` skips locally. The install
      # step above ran the fast tier; this is the only place the whole suite runs, so it is
      # not the redundant second pass it looks like.
      - name: Run Full Test Suite (VibeTags Library, incl. e2e)
        run: |
          cd vibetags
          mvn test -B -Pe2e

      - name: Verify Generated AI Config Files
        uses: ./.github/actions/verify-generated-files
        with:
          working-directory: examples/basic

      # Same rationale as the Maven job's upload: a Windows- or macOS-only failure with no
      # log is the expensive kind. The OS-specific file-handling paths are exactly why this
      # job exists, so their evidence must survive it.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-logs-${{ matrix.os }}
          path: |
            vibetags.log
            vibetags/vibetags.log
            examples/basic/vibetags.log
            vibetags/target/surefire-reports/
          if-no-files-found: ignore

  load-tests:
    name: Load Tests (JDK 21)
    runs-on: ubuntu-latest
    needs: build-maven

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags annotations
        run: |
          cd vibetags-annotations
          mvn install -B

      - name: Install VibeTags processor
        run: |
          cd vibetags
          mvn install -DskipTests -B

      # SignatureCaptureStressTest is in the list because it asserts a direction, not a duration:
      # a build with enforcement off must not allocate what only the enforcing mode reads. That is
      # a regression gate, and a regression gate that only runs on one laptop is not a gate. It
      # takes ~15s and does not depend on runner speed, unlike the volume sweep's wall-clock.
      - name: Run annotation-volume stress test (N ≤ 500), concurrent-build and signature-capture tests
        run: |
          # load-tests/pom.xml pins <processor.version> to whichever release is being compared, and
          # that pin is deliberate for cross-version work. It is wrong for this job: a regression
          # gate has to run against the code in the pull request, and the pin sat two releases
          # behind, so this step was gating an artifact downloaded from Maven Central. The
          # signature-capture guard passed on 0.9.5 — a build predating the optimization it exists
          # to protect — while reporting a 0.0% saving.
          VT_VERSION=$(cd vibetags && mvn -q help:evaluate -Dexpression=project.version -DforceStdout | tail -1)
          echo "Load-testing the processor built by this run: $VT_VERSION"
          # An empty or malformed value would silently fall back to the pom's pin, which is the
          # failure this step exists to remove. Fail loudly instead.
          case "$VT_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "could not resolve the processor version, got '$VT_VERSION'"; exit 1 ;;
          esac
          cd load-tests
          mvn test -B \
            -Dprocessor.version="$VT_VERSION" \
            -Dtest="AnnotationVolumeStressTest,ConcurrentBuildTest,SignatureCaptureStressTest" \
            -Dstress.max.classes=500

      - name: Upload stress-test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-results-${{ github.run_id }}
          path: load-tests/target/stress-results-*.txt

  build-gradle:
    name: Gradle Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21', '25', '26' ]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle

      - name: Publish VibeTags Annotations (Gradle)
        run: |
          cd vibetags-annotations
          ./gradlew clean build publishToMavenLocal --no-daemon

      - name: Build VibeTags Library (Gradle)
        run: |
          cd vibetags
          ./gradlew clean build publishToMavenLocal --no-daemon

      - name: Install VibeTags BOM (Maven, consumed by Gradle via mavenLocal)
        run: |
          cd vibetags-bom
          mvn install -B

      - name: Reset AI Config Files (Gradle)
        run: |
          cd examples/basic
          bash reset-ai-files.sh

      - name: Build Example Project (Gradle)
        run: |
          cd examples/basic
          ./gradlew clean build -PcompilerArgs="-Avibetags.log.path=../../vibetags.log" --no-daemon

      # JDK 21 only: the Kotlin Gradle plugin trails new JDK releases, and the example pins a
      # 21 toolchain anyway — the 25/26 legs would only re-test whether Kotlin tolerates a host
      # JDK it does not yet claim to support.
      - name: Build Kotlin Example Project (Gradle + kapt)
        if: matrix.java == '21'
        run: |
          cd examples/kotlin
          ./gradlew clean build --no-daemon
          # Proof kapt actually ran the processor over the Kotlin sources: the regenerated
          # files must name the annotated Kotlin elements, stub signatures included.
          grep -qF "com.example.kotlin.PaymentService.chargeKey(java.lang.String,int)" CLAUDE.md
          grep -qF "com.example.kotlin.CustomerVault" .cursorrules

      # The only CI job that runs VibeTags across a real Gradle reactor. Every other
      # multi-module fixture is Maven, and the other Gradle examples are single-module, so
      # without this the Gradle multi-module path was covered only by in-process JUnit
      # fixtures that write a settings.gradle rather than by Gradle itself.
      - name: Build Gradle Multi-Module Example (Gradle reactor, five subprojects)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          ./gradlew clean build --no-daemon
          # Both modules must aggregate into the root file, each in its own region.
          grep -qF "VIBETAGS-MODULE: core" CLAUDE.md
          grep -qF "VIBETAGS-MODULE: app" CLAUDE.md
          grep -qF "com.example.gmm.core.IrNode" CLAUDE.md
          grep -qF "com.example.gmm.app.App" CLAUDE.md
          # One sidecar per module, not one collapsed onto the root.
          test -f .vibetags-mod-core
          test -f .vibetags-mod-app
          test ! -f .vibetags-mod-_root_
          # Dual opt-in (CLAUDE.md + .claude/rules/) collapses each module region to a
          # scoped-rules index while the safety buckets stay inline. Every Maven fixture covers
          # this; before it was added here no Gradle build exercised the granular path at all,
          # so invariants 6 and 13 were Maven-only.
          grep -qF '<scoped_rules>' CLAUDE.md
          # core and app are role-routed, so the ROOT index names the shared role file, not a
          # per-class one. platform sits outside the glob and keeps its per-class name. Asserting
          # both is what stops a change to the role config from quietly emptying one path.
          grep -qF '.claude/rules/reactor-spine.md' CLAUDE.md
          grep -qF '.claude/rules/com-example-gmm-platform-Telemetry.md' CLAUDE.md
          # The safety bucket must NOT move into a scoped file: an agent has to see @AILocked
          # without opening anything.
          grep -qF '<locked_files>' CLAUDE.md
          grep -qF 'Core IR node shape is depended on by every downstream module' CLAUDE.md
          # The root granular dir carries the role file plus the unrouted per-class ones. core's
          # OWN dir resolves against core's role config, which does not exist, so it keeps the
          # per-class name: two stem namespaces, and asserting both is the regression test for the
          # spurious "stated nowhere" warning fixed alongside this fixture.
          test -f .claude/rules/reactor-spine.md
          test -f .claude/rules/com-example-gmm-platform-Telemetry.md
          test -f core/.claude/rules/com-example-gmm-core-IrNode.md
          # app/ did not opt in, so it gets no directory of its own. File presence is the only
          # opt-in (invariant 1), and this is where a regression would show first.
          test ! -d app/.claude
          # And every committed file must match what the build just produced. Scoped to the whole
          # example directory, not a file list: this reactor now opts into 51 services, and a list
          # is the thing that goes stale.
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::examples/gradle-multimodule/ guardrail files are out of date."
            git status --porcelain -- .
            git --no-pager diff -- .
            exit 1
          fi
          # A spurious "stated nowhere" warning on a reactor that had just written every file in
          # the right place is what the fixture work for issue #443 uncovered, so warnings are
          # asserted rather than assumed. Scoped to PROCESSOR-level warnings, meaning the ones
          # javac reports with no source element attached: showcase/ deliberately carries a
          # contradictory @AIDraft + @AILocked pair to demonstrate the validator, and that is an
          # element-level warning with a file:line prefix, so a blanket zero-warning gate would
          # fail on a fixture doing exactly what it is meant to do. Every warning this gate exists
          # to catch, both "stated nowhere" and the late-opt-in family, is processor-level.
          #
          # The late-opt-in family is excluded, and only that family. A cold checkout has no
          # .vibetags-mod-* sidecars (gitignored), so the first build writes every generated file
          # and stamps it newer than the sidecars recording when app and platform last compiled.
          # The second build therefore still reports "opted into after ... last compiled", truly
          # and transiently; it clears on the third. Measured: build 1 = 45 such warnings, build 2
          # = 30, build 3 = 0, with nothing else in any of them. Gating on a third build to dodge
          # that would be buying a clean number with two minutes of CI, so the family is named and
          # skipped instead. Everything else, "stated nowhere" included, still fails here.
          #
          # The log goes to RUNNER_TEMP so it can never dirty the tree the drift gate just checked.
          ./gradlew clean build --no-daemon > "$RUNNER_TEMP/gmm-build.log" 2>&1
          unexpected=$(grep "warning: VibeTags" "$RUNNER_TEMP/gmm-build.log" \
            | grep -vE "\.java:[0-9]+: warning:" | grep -v "was opted into after" | sort -u)
          if [ -n "$unexpected" ]; then
            echo "::error::a warm build of an in-sync reactor emitted unexpected processor warnings."
            echo "$unexpected"
            exit 1
          fi
          # And the specific regression this gate was built for, named so a future edit that
          # widens the exclusion above cannot quietly take it with it.
          if grep -q "stated nowhere" "$RUNNER_TEMP/gmm-build.log"; then
            echo "::error::the reactor reports guardrails stated nowhere on a correct build."
            grep "stated nowhere" "$RUNNER_TEMP/gmm-build.log" | sort -u
            exit 1
          fi

      # Ported from the Maven reactor, which had eleven verification steps to Gradle's one
      # (issue #443). The three most recent multi-module defects all came from Gradle
      # repositories, so the thinner coverage sat on the tool producing the bugs.
      - name: Verify Transitive Guardrails Propagate Through The Gradle Reactor
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # Gradle's class output is build/classes/java/main/, not Maven's target/classes/. That
          # difference is why this is asserted here as well: a manifest written to the wrong
          # directory is unreadable downstream and nothing else would notice.
          manifest=core/build/classes/java/main/vibetags/manifests/com.example.gmm.core.json
          if [ ! -f "$manifest" ]; then
            echo "::error::core published no transitive manifest at $manifest"
            find core/build -name '*.json' -print || true
            exit 1
          fi
          # An empty origin is the default, so grepping for the key alone would pass on a manifest
          # that attributes nothing. Assert the coordinate the marker file declares.
          grep -qF 'se.deversity.vibetags.example:gradle-multimodule-core:1.0' "$manifest" \
            || { echo "::error::manifest carries no origin coordinate"; cat "$manifest"; exit 1; }
          # A manifest nobody reads still builds and demonstrates nothing, so assert the consumer.
          region=$(awk '/VIBETAGS-MODULE: app /{f=1} f; /VIBETAGS-MODULE-END: app /{f=0}' CLAUDE.md)
          echo "$region" | grep -q 'Inherited Guardrails (dependencies)' \
            || { echo "::error::app imports the core package but inherited nothing"; echo "$region"; exit 1; }
          echo "$region" | grep -qF 'se.deversity.vibetags.example:gradle-multimodule-core:1.0' \
            || { echo "::error::inherited rules render without attribution"; echo "$region"; exit 1; }
          echo "app inherits the core package guardrails, attributed."

      - name: Verify Every AI Service Is Generated in a Gradle Reactor
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # The reactor root opts into every service, so every renderer runs through the sidecar
          # merge rather than only the handful the hand-written modules happened to need.
          expected=51
          actual=$(grep 'Active services' vibetags.log | tail -1 | sed 's/.*services (\([0-9]*\)).*/\1/')
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected $expected active services in the Gradle reactor, got $actual"
            grep 'Active services' vibetags.log | tail -1
            exit 1
          fi
          # Spot-check marker-based files from renderers nothing else asserts.
          for f in GEMINI.md QWEN.md .windsurfrules .clinerules CONVENTIONS.md \
                   .junie/guidelines.md .void/rules.md sweep.yaml ellipsis.yaml .roomodes \
                   .qwen/commands/refactor.md llms-full.txt .vibetags-locks .aiexclude \
                   .pr_agent.toml .coderabbit.yaml CLAUDE.local.md; do
            test -s "$f" || { echo "::error::reactor produced no content for: $f"; exit 1; }
            grep -qF "VIBETAGS" "$f" || { echo "::error::no VibeTags block in: $f"; exit 1; }
          done
          # Codex is the one service dropped unless AGENTS.md is the sole AI config file, which it
          # is not here. Opted in and still empty is the correct outcome, and asserting it keeps
          # the sole documented exception to "file presence is the opt-in" honest.
          test ! -s .codex/config.toml \
            || { echo "::error::.codex/config.toml has content but AGENTS.md is not the sole config"; exit 1; }
          echo "All $expected services active; Codex correctly dropped."

      - name: Verify Every Annotation Survives The Gradle Reactor Merge
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # annotations-showcase/ carries all 44 @AI* annotations, and opts into an aggregate of its own with
          # no granular directory beside it, so its module file is a FULL inline aggregate. That
          # makes it the one place in this reactor where the renderer's element buckets can be
          # counted the way the Maven reactor counts them in its root file: a renderer that
          # silently drops a family fails here.
          #
          # The reactor ROOT cannot be used for this count, and that is not a workaround. The root
          # opts into CLAUDE.md AND .claude/rules/, so its regions collapse to a scoped-rules index
          # by design (invariant 6). Counting families in an indexed aggregate would be asserting
          # the opposite of what this reactor exists to demonstrate.
          declared=$(ls ../../vibetags-annotations/src/main/java/se/deversity/vibetags/annotations/*.java | wc -l)
          sections=$(grep -o '^  <[a-z_]*>' annotations-showcase/CLAUDE.md | sort -u | wc -l)
          if [ "$sections" -ne "$declared" ]; then
            echo "::error::annotations-showcase/CLAUDE.md has $sections element sections for $declared annotations"
            grep -o '^  <[a-z_]*>' annotations-showcase/CLAUDE.md | sort -u
            exit 1
          fi
          # And the root merge must not drop the module: every showcase element it indexes has to
          # be reachable, so the count is asserted rather than merely the region marker.
          grep -qF "VIBETAGS-MODULE: annotations-showcase" CLAUDE.md \
            || { echo "::error::annotations-showcase is missing from the reactor root merge"; exit 1; }
          indexed=$(grep -c 'rules=".claude/rules/com-example-' CLAUDE.md)
          if [ "$indexed" -lt 30 ]; then
            echo "::error::the root index names only $indexed showcase elements; the merge dropped some"
            exit 1
          fi
          echo "All $declared annotation families present, and $indexed showcase elements indexed at the root."

      - name: Verify Reactor YAML Is Readable By The Tools That Consume It (Gradle)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # "The file exists and says VIBETAGS" is not enough: the merge once stacked each module's
          # whole document, so these carried their top-level key once per module. Strict parsers
          # rejected them, lenient ones silently kept only the last module. Parse with duplicate
          # keys forbidden, and assert an element only one module declares survives the parse.
          python3 - <<'PY'
          import sys, yaml

          FILES = ["sweep.yaml", "ellipsis.yaml", ".coderabbit.yaml", ".plandex.yaml",
                   ".roomodes", ".interpreter/profiles/vibetags.yaml"]
          WITNESSES = {
              "core": "com.example.gmm.core.IrNode",
              "app": "com.example.gmm.app.App",
              "platform": "com.example.gmm.platform.Telemetry",
          }

          class Strict(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen = set()
              for key_node, _ in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"duplicate top-level key {key!r}", key_node.start_mark)
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)

          Strict.construct_mapping = no_duplicates

          failed = False
          for path in FILES:
              text = open(path, encoding="utf-8").read()
              try:
                  parsed = str(yaml.load(text, Loader=Strict))
              except Exception as e:
                  print(f"::error file={path}::not a valid YAML document: {e}")
                  failed = True
                  continue
              missing = [m for m, w in WITNESSES.items() if w not in parsed]
              if missing:
                  print(f"::error file={path}::merged away the guardrails of module(s): {missing}")
                  failed = True
              else:
                  print(f"{path}: parses strictly, all {len(WITNESSES)} modules survive")
          sys.exit(1 if failed else 0)
          PY

      - name: Verify Per-Module (nested) Output In A Gradle Reactor
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # core/ opts into an aggregate AND a granular dir, so it gets an INDEXED module file.
          # platform/ opts into the aggregate only, so it gets a plain one. Two nested shapes in
          # one reactor.
          grep -qF "com.example.gmm.core.IrNode" core/CLAUDE.md \
            || { echo "::error::MISSING in core/CLAUDE.md: the module's own guardrail"; exit 1; }
          grep -qF "<scoped_rules>" core/CLAUDE.md \
            || { echo "::error::core opted into a granular dir, so its module file must be indexed"; exit 1; }
          grep -qF "com.example.gmm.platform.Telemetry" platform/CLAUDE.md \
            || { echo "::error::MISSING in platform/CLAUDE.md: the module's own guardrail"; exit 1; }
          # Module-scoped means module-scoped: no sibling may leak in.
          for foreign in "com.example.gmm.app.App" "com.example.gmm.platform.Telemetry"; do
            if grep -qF "$foreign" core/CLAUDE.md; then
              echo "::error::LEAKED into core/CLAUDE.md: $foreign"; exit 1
            fi
          done
          if grep -qF "com.example.gmm.core.IrNode" platform/CLAUDE.md; then
            echo "::error::LEAKED into platform/CLAUDE.md: the core guardrail"; exit 1
          fi
          # A module's own granular dir resolves against its OWN role config, which it does not
          # have, so it keeps per-class names while the root role-routes the same elements. Those
          # two namespaces meeting in one sidecar field produced a spurious "stated nowhere"
          # warning until the fix that ships with this change.
          test -f core/.claude/rules/com-example-gmm-core-IrNode.md \
            || { echo "::error::the module's own granular dir lost its per-class file"; exit 1; }
          # ...and the reactor root still merges every module.
          grep -qF "com.example.gmm.core.IrNode" CLAUDE.md \
            || { echo "::error::root CLAUDE.md must still merge all modules"; exit 1; }
          echo "Per-module output is module-scoped; reactor root still merges all modules."

      - name: Verify Cross-Module Mirroring In A Gradle Reactor (issue #312)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # tests/ has no @AI* annotations of its own and opted in via .vibetags-mirror, so each
          # source module's scoped rules must be mirrored there under its own namespace.
          for f in mirrored-core-com-example-gmm-core-IrNode.md \
                   mirrored-app-com-example-gmm-app-App.md \
                   mirrored-platform-com-example-gmm-platform-Telemetry.md; do
            test -f "tests/.claude/rules/$f" || { echo "::error::MISSING mirrored rule: $f"; exit 1; }
          done
          # A mirrored file carries the source rule verbatim, with the target's globs appended.
          grep -qF "Core IR node shape" tests/.claude/rules/mirrored-core-com-example-gmm-core-IrNode.md \
            || { echo "::error::mirrored rule lost the source module's guardrail"; exit 1; }
          grep -qF 'tests/src/test/java' tests/.claude/rules/mirrored-core-com-example-gmm-core-IrNode.md \
            || { echo "::error::mirrored rule is not scoped to the target module's sources"; exit 1; }
          # Mirroring must create no region in the reactor root. tests/ carries no annotations and
          # its sources are test sources, so it contributes nothing to the merge; a mirrored rule
          # reaching the aggregate would show up as a region here.
          if grep -qF "VIBETAGS-MODULE: tests" CLAUDE.md; then
            echo "::error::mirroring must not put a module into the reactor root aggregate"
            awk '/VIBETAGS-MODULE: tests /{f=1} f; /VIBETAGS-MODULE-END: tests /{f=0}' CLAUDE.md
            exit 1
          fi
          echo "Sibling module rules mirrored into the centralised test module."

      - name: Verify Granular Role Files Merge Across Gradle Modules (issue #365)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          # .vibetags-roles routes core/ and app/ into ONE root rule file, so both modules write
          # the same path. Each compile used to replace it with its own classes alone, and only the
          # module that happened to compile last kept its guardrails.
          for dir in .ai/rules .amazonq/rules .claude/rules .continue/rules .kiro/steering \
                     .pearai/rules .roo/rules .tabnine/guidelines .trae/rules; do
            f="$dir/reactor-spine.md"
            test -f "$f" || { echo "::error::MISSING role rule file: $f"; exit 1; }
            for token in "com.example.gmm.core.IrNode" "com.example.gmm.app.App"; do
              grep -qF "$token" "$f" || { echo "::error::MISSING in $f: $token"; exit 1; }
            done
          done
          # A class matching no role keeps its own per-class file: the merge must not eat that path.
          test -f .kiro/steering/com-example-gmm-platform-Telemetry.md \
            || { echo "::error::unrouted classes lost their per-class rule file"; exit 1; }
          # The second repro from the report, in Gradle terms: building ONE subproject must leave
          # the shared file byte-identical, or an unrelated one-module edit produces a spurious
          # diff in a generated file.
          before=$(md5sum .kiro/steering/reactor-spine.md | cut -d' ' -f1)
          ./gradlew :core:build --no-daemon
          after=$(md5sum .kiro/steering/reactor-spine.md | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "::error::a one-module Gradle build rewrote the shared role file:"
            git --no-pager diff -- .kiro/steering/reactor-spine.md
            exit 1
          fi
          echo "Role files merge across modules and survive a one-subproject rebuild."

      # The only check-mode gate on the Gradle side; every other one is Maven. It runs twice on
      # purpose. The second run is the point: check mode lives inside the annotation processor,
      # so it runs only if javac runs, and Gradle skips an UP-TO-DATE compileJava. Measured with
      # the example's `outputs.upToDateWhen { false }` removed and the committed CLAUDE.md
      # deliberately drifted, this step reported `compileJava UP-TO-DATE` and exited 0. A gate
      # that green-lights a drifted tree is worse than no gate.
      - name: Gradle Check Mode (in sync passes, and is not skipped on a warm build)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          ./gradlew build -PvibetagsCheck --no-daemon
          # Redirect rather than pipe to tee: a pipe reports tee's exit status, which would turn
          # a failed check into a green step.
          ./gradlew build -PvibetagsCheck --no-daemon > check.log 2>&1
          cat check.log
          if grep -qE ':(core|app):compileJava UP-TO-DATE' check.log; then
            echo "::error::compileJava was skipped, so check mode verified nothing."
            exit 1
          fi
          grep -q "check passed" check.log
          rm -f check.log

      # The other half: a gate that cannot fail is not a gate. Drift the committed output and
      # the same command must exit non-zero, and must not repair the file behind our back.
      - name: Gradle Check Mode (drifted output must fail the build)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-multimodule
          cp CLAUDE.md CLAUDE.md.orig
          sed -i 's/Core IR node shape is depended on by every downstream module/DRIFT/' CLAUDE.md
          set +e
          ./gradlew build -PvibetagsCheck --no-daemon > drift.log 2>&1
          status=$?
          set -e
          cat drift.log
          if [ "$status" -eq 0 ]; then
            echo "::error::check mode passed on a drifted CLAUDE.md."
            mv CLAUDE.md.orig CLAUDE.md; rm -f drift.log
            exit 1
          fi
          grep -q "check failed" drift.log
          # Check mode must never write. If it repaired the drift, the file would be back in sync.
          grep -q "DRIFT" CLAUDE.md
          mv CLAUDE.md.orig CLAUDE.md
          rm -f drift.log
          git diff --quiet -- CLAUDE.md

      # Subprojects configured from the root build file, so none of them has a build file
      # of its own and the module-root walk lands on the root for all of them. Without
      # -Avibetags.module they share one identity and overwrite each other, losing every
      # module's guardrails but the last to compile. This asserts the remedy holds.
      - name: Build Gradle Shared-Build-File Example (identity from -Avibetags.module)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-shared-buildfile
          ./gradlew clean build --no-daemon
          grep -qF "VIBETAGS-MODULE: core" CLAUDE.md
          grep -qF "VIBETAGS-MODULE: app" CLAUDE.md
          # The regression this pins: app's guardrail is what disappears on a collapse.
          grep -qF "com.example.gsb.app.Runner" CLAUDE.md
          grep -qF "com.example.gsb.core.Ledger" CLAUDE.md
          test -f .vibetags-mod-core
          test -f .vibetags-mod-app
          test ! -f .vibetags-mod-_root_
          if [ -n "$(git status --porcelain -- CLAUDE.md)" ]; then
            echo "::error::examples/gradle-shared-buildfile/CLAUDE.md is out of date."
            git --no-pager diff -- CLAUDE.md
            exit 1
          fi

      # Flat layout: lib/ sits beside the Gradle root rather than under it. Pins that
      # pointing vibetags.root at the directory containing both keeps real module names,
      # instead of the absolute-path hash an out-of-tree module would otherwise get.
      - name: Build Gradle Flat-Layout Example (module beside the root)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-flat/app
          ./gradlew clean build --no-daemon
          cd ..
          # Both names explicit, matching gradle-composite. Inherited from settings.gradle the
          # root would read "vibetags-example-gradle-flat" beside a plain "lib" (issue #449), so
          # asserting the readable name is what stops that drifting back.
          grep -qF "VIBETAGS-MODULE: app" CLAUDE.md
          grep -qF "VIBETAGS-MODULE: lib" CLAUDE.md
          grep -qF "com.example.gflat.lib.Store" CLAUDE.md
          grep -qF "com.example.gflat.app.Console" CLAUDE.md
          test -f .vibetags-mod-app
          test -f .vibetags-mod-lib
          # A hash-named sidecar means the module resolved out of tree: the failure this pins.
          if ls .vibetags-mod-* | grep -qE "\.vibetags-mod-[0-9a-f]{6,}$"; then
            echo "::error::a module resolved out of tree and was filed under a path hash."
            ls -a | grep vibetags-mod
            exit 1
          fi
          if [ -n "$(git status --porcelain -- CLAUDE.md)" ]; then
            echo "::error::examples/gradle-flat/CLAUDE.md is out of date."
            git --no-pager diff -- CLAUDE.md
            exit 1
          fi

      # Composite build: two separate Gradle builds joined with includeBuild. Neither is the
      # other's root, so both are pointed at the directory containing them; without that they
      # write two separate sets of generated files.
      - name: Build Gradle Composite Example (includeBuild)
        if: matrix.java == '21'
        run: |
          cd examples/gradle-composite/app
          ./gradlew clean build --no-daemon
          cd ..
          grep -qF "VIBETAGS-MODULE: app" CLAUDE.md
          grep -qF "VIBETAGS-MODULE: lib" CLAUDE.md
          grep -qF "com.example.gcomp.lib.Codec" CLAUDE.md
          test -f .vibetags-mod-app && test -f .vibetags-mod-lib
          if [ -n "$(git status --porcelain -- CLAUDE.md)" ]; then
            echo "::error::examples/gradle-composite/CLAUDE.md is out of date."
            git --no-pager diff -- CLAUDE.md
            exit 1
          fi

      # Same JDK 21 gating and same shape as the Kotlin step. Groovy's joint compilation
      # generates Java stubs and (with javaAnnotationProcessing=true) runs JSR 269
      # processors over them — the Groovy analogue of kapt.
      - name: Build Groovy Example Project (Gradle, joint-compilation stubs)
        if: matrix.java == '21'
        run: |
          cd examples/groovy
          ./gradlew clean build --no-daemon
          grep -qF "com.example.groovy.InventoryService.reserve(java.lang.String,int)" CLAUDE.md
          grep -qF "com.example.groovy.InventoryService" .cursorrules

      # The Scala example asserts the limitation as well as the feature: scalac has no
      # JSR 269 support, so the annotated Java class must appear and the annotated Scala
      # class must NOT — if ReportEngine ever shows up, the assertion below goes red and
      # the docs are wrong, not the build.
      - name: Build Scala Example Project (Gradle, Java sources only)
        if: matrix.java == '21'
        run: |
          cd examples/scala
          ./gradlew clean build --no-daemon
          grep -qF "com.example.scala.AuditLog" CLAUDE.md
          ! grep -q "ReportEngine" CLAUDE.md
          ! grep -q "ReportEngine" .cursorrules

      # -Pe2e mirrors the Maven profile; see vibetags/build.gradle. The `build` step above
      # ran the fast tier only, so without this the Gradle legs never see the e2e classes.
      - name: Run Full Test Suite (VibeTags Library, incl. e2e)
        run: |
          cd vibetags
          ./gradlew test -Pe2e --no-daemon

      - name: Verify Generated AI Config Files
        uses: ./.github/actions/verify-generated-files
        with:
          working-directory: examples/basic

      - name: Upload coverage to Codecov
        if: matrix.java == '21'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: vibetags/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests-gradle
          fail_ci_if_error: false

  # Dogfood of action/locked-files: the same guard this repo ships to consumers runs on
  # this repo's own PRs. It compiles the PR head with -Pself-annotate so .vibetags-locks
  # is fresh, then intersects the PR diff with the locked line ranges; a diff that touches
  # an @AILocked element fails here and names the element and its reason. PR-only: the
  # guard is about proposed changes, and it needs a base to diff against.
  # Real Java that nobody wrote to suit VibeTags. Every fixture in this repository was written
  # by someone who knew what the processor does; these six libraries were not, and they are
  # where the assumptions break. Each is compiled twice, with and without VibeTags, and the two
  # runs are compared: same exit code, no new diagnostics, no file written into a project that
  # never opted in, and ElementNaming rendering every member the way javac does. corpus/README.md
  # has the rest, including the defect this found on its first run.
  corpus:
    name: Third-Party Corpus
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Keyed on repos.tsv, so a pin bump fetches and any other change reuses the clones. The
      # repos are pinned to commits, so a hit is always the right source.
      - name: Cache the corpus checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/corpus
          key: corpus-${{ hashFiles('corpus/repos.tsv') }}

      - name: Install VibeTags Annotations and Processor (Maven)
        run: |
          cd vibetags-annotations
          mvn install -B -q -DskipTests
          cd ../vibetags
          mvn install -B -q -DskipTests

      - name: Run VibeTags over the corpus and compare against the control
        run: corpus/run-corpus.sh

  # The one leg that does not run javac. docs/PROCESSOR.md and USAGE.md both promise that
  # VibeTags degrades - loses @AILocked positions, keeps every guardrail - under a compiler
  # with no Tree API, and nothing verified either sentence. The paths behind them are
  # unreachable from a JUnit test running under javac, and reaching them from one would mean
  # adding a seam to production code purely so a test could fail it (issue #475). Compiling
  # a real fixture under a real ECJ needs no seam and checks the documented behaviour.
  ecj-degradation:
    name: Non-javac Compiler Degradation (ECJ)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags Annotations and Processor (Maven)
        run: |
          cd vibetags-annotations
          mvn install -B -q -DskipTests
          cd ../vibetags
          mvn install -B -q -DskipTests

      # Runs both compilers over the same fixture and compares. The javac half is the
      # control: without it every ECJ assertion passes equally well on an empty report.
      - name: Verify the processor degrades under ECJ rather than failing
        run: scripts/ecj-degradation-check.sh

  locked-files:
    name: Locked Files Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags Annotations and Processor (Maven)
        run: |
          cd vibetags-annotations
          mvn install -B -q -DskipTests
          cd ../vibetags
          mvn install -B -q -DskipTests

      # The guard shipped for two releases with no tests of its own, and carried two
      # false-positive sources that one fixture would have caught: locks from one reactor
      # matching another reactor's identically-named paths, and a PR that adds an @AILocked
      # element failing on its own additions. Both are pinned now. Stdlib unittest, so this
      # adds no dependency.
      - name: Test the locked-files guard
        run: python3 -m unittest discover -s action/locked-files -v

      - name: Guard @AILocked elements against this PR's diff
        uses: ./action/locked-files
        with:
          working-directory: .
          build-command: mvn -B -q -f vibetags/pom.xml clean compile -Pself-annotate

  # The committed architecture diagrams under docs/diagrams/codekarta/ are generated from
  # source by code-karta; a diagram that only regenerates when someone remembers is
  # documentation, not telemetry. This job regenerates them and fails on structural drift,
  # which makes "the picture matches the code" a property of every commit rather than a hope.
  # Structural, not byte-level: code-karta 0.1.0's directory walk follows filesystem order,
  # so bytes differ between the OS that committed and the OS that checks (this job's first
  # run proved it: same node set, different positions). tools/diagram-structure.sh extracts
  # the deterministic part - the sorted set of node titles - and that is what must match.
  diagrams:
    name: Architecture Diagram Drift
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Snapshot the committed diagrams' structure
        run: sh tools/diagram-structure.sh docs/diagrams/codekarta > /tmp/diagram-structure-committed.txt

      - name: Regenerate the diagrams
        run: sh tools/generate-architecture-diagrams.sh

      - name: Fail on structural drift
        run: |
          sh tools/diagram-structure.sh docs/diagrams/codekarta > /tmp/diagram-structure-fresh.txt
          if ! diff -u /tmp/diagram-structure-committed.txt /tmp/diagram-structure-fresh.txt; then
            echo "::error::Architecture diagrams are stale: the code's shape moved and the committed pictures did not."
            echo "::error::Run: sh tools/generate-architecture-diagrams.sh   then commit the regenerated SVGs."
            exit 1
          fi
          echo "Diagram structure matches the code."

      # When drift fails the job, hand the fresh SVGs to the committer instead of making
      # them reproduce the toolchain locally.
      - name: Upload regenerated diagrams
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-diagrams
          path: docs/diagrams/codekarta/
          if-no-files-found: ignore

  # Mutation testing moved to .github/workflows/mutation.yml and runs on demand only
  # (workflow_dispatch). It was the longest job here and nothing gated on its result.
