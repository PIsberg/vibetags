# Instruction evals: the merge gate for the instruction layer. When a PR edits the files
# agents obey (CLAUDE.md, AGENTS.md, GEMINI.md, .claude/**), this runs the task bank in
# evals/ and fails if any measured rule drops below its floor - the same idea as running
# the test suite when a PR edits code. evals/README.md documents the method and its limits.
#
# Cost: a default run is 18 headless model sessions (6 tasks x 3 trials). That is why this
# triggers on the instruction-file paths and manual dispatch, never on every commit. The consumer
# proof (dispatch with suite=consumer, evals/consumer/README.md) is dispatch-only: 4 tasks x 3
# variants, so 36 sessions at 3 trials and 120 at the decision-grade 10.
#
# Requires either the ANTHROPIC_API_KEY secret (billed to the API) or CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`, drawn from a Claude subscription's usage allowance); without
# either the evals job is SKIPPED rather than reporting a green check it did not earn (#632) -
# see the preflight job below for why that needs two jobs. Fork PRs receive neither secret, so
# they always skip. The claude CLI is pinned by evals/package-lock.json and installed with `npm ci`,
# so a run resolves the same integrity-checked tarballs every time instead of whatever npm
# serves that day, and actions/setup-node pins the node/npm doing that install rather than
# taking whatever the runner image ships. The CLI's flag surface still has to track the live
# API, so Dependabot raises the pin on its own schedule and the harness fails loudly
# (exit 2) if flags drift.

name: Instruction Evals

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.claude/**'
      - 'evals/**'
      - '.github/workflows/instruction-evals.yml'
  workflow_dispatch:
    inputs:
      trials:
        description: 'Trials per task (10 for decision-grade runs)'
        required: false
        default: '3'
      suite:
        description: 'repo: this repository''s own rules. consumer: the consumer proof, all three variants against evals/consumer/fixture (3x the sessions)'
        required: false
        default: 'repo'
        type: choice
        options:
          - repo
          - consumer
      tasks:
        description: 'Space-separated task directory names to run (TASKS). Empty runs every task of the suite'
        required: false
        default: ''
      model:
        description: 'Model id for the trials (EVAL_MODEL). Empty keeps the harness default; use the model that writes production code here'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: instruction-evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Exists only so the evals job can be SKIPPED rather than reporting a result it did not earn.
  # `jobs.<id>.if` cannot read the `secrets` context - only github, needs, vars and inputs - so the
  # answer has to arrive as a job output. Without this the workflow's only options were a green tick
  # for a job that ran nothing (what it did for months, #632) or a red one that blocks every PR
  # touching the instruction files. A skipped job is neither: the check reads "Skipped" in the PR,
  # which is visibly not a pass.
  preflight:
    name: Check for the eval key
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - id: check
        env:
          HAVE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "has_key=$HAVE_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAVE_KEY" != "true" ]; then
            {
              echo "## Instruction evals were SKIPPED"
              echo
              echo "Neither the \`ANTHROPIC_API_KEY\` nor the \`CLAUDE_CODE_OAUTH_TOKEN\` repository"
              echo "secret is configured, so the task bank did not run. The evals job is skipped rather"
              echo "than green: a skipped gate is not a passed gate, and a green tick here would be"
              echo "indistinguishable from a measurement."
              echo
              echo "Set either secret to turn this into a real check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Instruction evals skipped: neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is configured. Skipped is not passed (#632)."
          fi

  evals:
    name: Instruction Evals
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_key == 'true'
    steps:
      # The agent lane runs sandboxed: ephemeral runner, the model credential as its only secret,
      # egress BLOCKED except what the job demonstrably needs (Anthropic API, GitHub, npm
      # for the CLI install). Extend the list in a reviewed commit if a legitimate endpoint
      # gets blocked; never flip back to audit.
      - name: Harden the runner (Block egress, allowlist only)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            statsig.anthropic.com:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            azure.archive.ubuntu.com:80
            archive.ubuntu.com:80
            security.ubuntu.com:80
            packages.microsoft.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The lockfile pins the CLI; this pins the toolchain that installs it. Without this step
      # the job ran on whatever `ubuntu-latest` shipped that week, and the npm version is
      # behaviour, not plumbing: npm 11.17 added an allow-scripts gate that can defer a
      # package's postinstall, and this package's postinstall is what swaps the 500-byte
      # placeholder for the native binary. Node 22 LTS bundles npm 10.9.x, which predates that
      # gate entirely, so the install step's behaviour stops depending on the runner image.
      #
      # The floor is the CLI's own `engines.node` (>=22.0.0 at 2.1.245). EvalsNodePinTest reads
      # both this literal and that field out of evals/package-lock.json and fails when they stop
      # agreeing, so a Dependabot bump that raises the floor turns CI red here instead of
      # failing a $-costing eval run later. Dependabot bumps the action SHA on its own.
      - name: Pin the Node toolchain that installs the CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'

      # `npm ci` against the committed lockfile, not `npm install -g`: the lockfile carries
      # an integrity hash per tarball, so a compromised or moved republish fails the install
      # instead of silently running. The version check is not decoration - npm can defer a
      # package's postinstall, and this package's postinstall is what swaps the 500-byte
      # placeholder for the native binary. Without the check that stub surfaces as a dozen
      # identical trial failures later; with it, the job stops here.
      - name: Install the claude CLI (pinned by evals/package-lock.json)
        working-directory: evals
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          "$PWD/node_modules/.bin/claude" --version

      # The consumer suite's privacy detector compiles and runs the agent's code. The runner image
      # already carries JDK 21, so this points PATH at it rather than adding a download (and an
      # egress endpoint) to the blocked lane.
      - name: Put the preinstalled JDK 21 on PATH
        if: github.event.inputs.suite == 'consumer'
        run: |
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_21_X64/bin/javac" -version

      # The harness sets CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 so the agent's shell commands cannot read
      # the credential. On Linux the CLI enforces that with bubblewrap and refuses to start without
      # it: every session of the first decision-grade run (CI run 39370876182) failed with
      # "bubblewrap is required for subprocess env scrubbing". Ubuntu 24.04 also restricts the
      # unprivileged user namespaces bubblewrap needs, so that restriction is lifted on this
      # disposable runner, and the step proves bwrap runs before any session is spent. The sandbox
      # also needs socat: without it run 39371257902 started every session but no shell command
      # ran ("Sandbox is required but failed to initialize: socat not installed").
      - name: Install bubblewrap and socat for the subprocess credential scrub
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          command -v socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc true
          echo "bubblewrap $(bwrap --version) runs"

      - name: Run the task bank
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRIALS: ${{ github.event.inputs.trials || '3' }}
          SUITE: ${{ github.event.inputs.suite || 'repo' }}
          MODEL_INPUT: ${{ github.event.inputs.model }}
          TASKS: ${{ github.event.inputs.tasks }}
          RESULTS_DIR: ${{ github.workspace }}/eval-results
        run: |
          # A secret that is not configured arrives as an empty variable, not an absent one.
          # Unset it so the CLI sees only the credential that exists.
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          # An empty input leaves EVAL_MODEL unset, so the harness keeps its own default.
          if [ -n "$MODEL_INPUT" ]; then export EVAL_MODEL="$MODEL_INPUT"; fi
          if [ "$SUITE" = "consumer" ]; then
            # The proof's report is the result; a variant below its floors is a finding, so only
            # a harness failure (exit 2) fails the job.
            PROOF_DIR="$RESULTS_DIR" bash evals/consumer/run-proof.sh && status=0 || status=$?
            if [ -f "$RESULTS_DIR/REPORT.md" ]; then
              cat "$RESULTS_DIR/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit $status
          fi
          bash evals/run-instruction-evals.sh && status=0 || status=$?
          echo "## Instruction evals" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS_DIR/summary.csv" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS_DIR/summary.csv" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload trial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instruction-eval-results
          path: eval-results/
          if-no-files-found: ignore
