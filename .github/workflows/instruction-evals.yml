# Instruction evals: the merge gate for the instruction layer. When a PR edits the files
# agents obey (CLAUDE.md, AGENTS.md, GEMINI.md, .claude/**), this runs the task bank in
# evals/ and fails if any measured rule drops below its floor - the same idea as running
# the test suite when a PR edits code. evals/README.md documents the method and its limits.
#
# Cost: a default run is 12 headless model sessions (4 tasks x 3 trials). That is why this
# triggers on the instruction-file paths and manual dispatch, never on every commit.
#
# Requires the ANTHROPIC_API_KEY secret; without it the run reports SKIPPED, which is not
# a pass. The claude CLI is pinned by evals/package-lock.json and installed with `npm ci`,
# so a run resolves the same integrity-checked tarballs every time instead of whatever npm
# serves that day, and actions/setup-node pins the node/npm doing that install rather than
# taking whatever the runner image ships. The CLI's flag surface still has to track the live
# API, so Dependabot raises the pin on its own schedule and the harness fails loudly
# (exit 2) if flags drift.

name: Instruction Evals

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - '.claude/**'
      - 'evals/**'
      - '.github/workflows/instruction-evals.yml'
  workflow_dispatch:
    inputs:
      trials:
        description: 'Trials per task (10 for decision-grade runs)'
        required: false
        default: '3'

permissions:
  contents: read

concurrency:
  group: instruction-evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  evals:
    name: Instruction Evals
    runs-on: ubuntu-latest
    env:
      HAVE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      # The agent lane runs sandboxed: ephemeral runner, the API key as its only secret,
      # egress BLOCKED except what the job demonstrably needs (Anthropic API, GitHub, npm
      # for the CLI install). Extend the list in a reviewed commit if a legitimate endpoint
      # gets blocked; never flip back to audit.
      - name: Harden the runner (Block egress, allowlist only)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            statsig.anthropic.com:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Note when the key is absent
        if: env.HAVE_KEY != 'true'
        run: |
          echo "SKIPPED: ANTHROPIC_API_KEY secret is not configured; the instruction evals did not run." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Instruction evals skipped: ANTHROPIC_API_KEY secret is not configured. Skipped is not passed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAVE_KEY == 'true'

      # The lockfile pins the CLI; this pins the toolchain that installs it. Without this step
      # the job ran on whatever `ubuntu-latest` shipped that week, and the npm version is
      # behaviour, not plumbing: npm 11.17 added an allow-scripts gate that can defer a
      # package's postinstall, and this package's postinstall is what swaps the 500-byte
      # placeholder for the native binary. Node 22 LTS bundles npm 10.9.x, which predates that
      # gate entirely, so the install step's behaviour stops depending on the runner image.
      #
      # The floor is the CLI's own `engines.node` (>=22.0.0 at 2.1.245). EvalsNodePinTest reads
      # both this literal and that field out of evals/package-lock.json and fails when they stop
      # agreeing, so a Dependabot bump that raises the floor turns CI red here instead of
      # failing a $-costing eval run later. Dependabot bumps the action SHA on its own.
      - name: Pin the Node toolchain that installs the CLI
        if: env.HAVE_KEY == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      # `npm ci` against the committed lockfile, not `npm install -g`: the lockfile carries
      # an integrity hash per tarball, so a compromised or moved republish fails the install
      # instead of silently running. The version check is not decoration - npm can defer a
      # package's postinstall, and this package's postinstall is what swaps the 500-byte
      # placeholder for the native binary. Without the check that stub surfaces as a dozen
      # identical trial failures later; with it, the job stops here.
      - name: Install the claude CLI (pinned by evals/package-lock.json)
        if: env.HAVE_KEY == 'true'
        working-directory: evals
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          "$PWD/node_modules/.bin/claude" --version

      - name: Run the task bank
        if: env.HAVE_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIALS: ${{ github.event.inputs.trials || '3' }}
          RESULTS_DIR: ${{ github.workspace }}/eval-results
        run: |
          bash evals/run-instruction-evals.sh && status=0 || status=$?
          echo "## Instruction evals" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULTS_DIR/summary.csv" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$RESULTS_DIR/summary.csv" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

      - name: Upload trial logs
        if: env.HAVE_KEY == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instruction-eval-results
          path: eval-results/
          if-no-files-found: ignore
