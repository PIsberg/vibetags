name: Mutation Testing (PIT)

# On demand only. A full PIT run over se.deversity.vibetags.* costs far more wall-clock than the
# rest of CI combined and its score moves slowly, so running it on every push bought a number
# nobody read. Trigger it from Actions -> Mutation Testing (PIT) -> Run workflow, choosing the
# branch to analyse, when test strength is the actual question.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Mutation Testing (PIT)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags Annotations (Maven)
        run: |
          cd vibetags-annotations
          mvn install -B

      # -Pe2e is not optional here. pitest-maven parses surefire's configuration, which carries
      # <excludedGroups>${vibetags.test.excludedGroups}</excludedGroups> = "e2e" by default, so
      # without it PIT runs the fast tier and scores the project as if the other 55 test classes
      # did not exist. Measured on main @ edab0c2 over the seven classes PIT reported as entirely
      # uncovered: 19% line coverage and 16/211 mutants killed without -Pe2e, 88% and 142/211 with
      # it, for 12m22s against 19m27s. The uncovered code was never untested, only unmeasured.
      # Every other CI leg passes -Pe2e; this job was the one that did not.
      - name: Run Mutation Coverage (PIT)
        run: |
          cd vibetags
          mvn -B -Pmutation -Pe2e test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitest-report-${{ github.run_id }}
          path: vibetags/target/pit-reports/**
          if-no-files-found: warn
