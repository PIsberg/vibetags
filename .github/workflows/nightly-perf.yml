# The scheduled performance ring. The inner loop asserts an allocation budget on every e2e
# run (ProcessorAllocationBudgetTest); this workflow is the other half of the performance
# contract: a weekly measurement of the allocation sweeps against the newest committed
# baseline under load-tests/results/.
#
# It compares allocation, not wall-clock, because allocation is the only metric this
# harness's own documentation certifies as stable (0.6% between runs; wall-clock varies up
# to 1.93x on shared hardware - see .claude/skills/load-tests/SKILL.md). Deviation beyond
# the band emits a WARNING and a red-flag summary rather than failing the job: the committed
# baselines were captured on a different machine and JDK, so a hard gate here would fail on
# environment, not on regression. A warning that repeats week after week is the signal to
# capture a fresh baseline and investigate.

name: Nightly Perf Ring

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  # One run per workflow per ref. cancel-in-progress everywhere except main: a superseded
  # push has nothing left to say, while a run on main is the record of main's health and
  # must finish. Without this a second push queued a full copy behind the run it replaced
  # and both completed, which is half of why wall-clock tripled while every job kept its
  # speed (#573).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  perf:
    name: Allocation Sweep vs Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install VibeTags Annotations and Processor (Maven)
        run: |
          cd vibetags-annotations
          mvn install -B -q -DskipTests
          cd ../vibetags
          mvn install -B -q -DskipTests

      - name: Run the allocation sweep
        run: |
          cd load-tests
          mvn test -B -Dtest="MemoryVolumeStressTest" -Dstress.max.classes=500

      - name: Compare against the newest committed baseline
        run: |
          fresh=$(ls -t load-tests/target/memory-results-*.txt | head -1)
          baseline_dir=$(ls load-tests/results/ | grep -E '^[0-9]' | sort -V | tail -1)
          baseline="load-tests/results/$baseline_dir/memory.txt"
          echo "## Nightly perf ring" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$baseline" ]; then
            echo "SKIPPED comparison: no committed baseline found. Skipped is not passed." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No baseline under load-tests/results/; sweep ran, comparison skipped."
            exit 0
          fi
          echo "Baseline: $baseline (captured for version $baseline_dir; current tree may be newer - a version gap is context, not an error)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # ProcessorAlloc(KB) at N=100 and N=500, fresh vs baseline, +-35% band. N=10 is
          # excluded on the harness's own evidence: cache initialisation amortises so badly
          # there that two runs of one build have differed 4x.
          for n in 100 500; do
            fresh_kb=$(awk -v n="$n" '$1 == n { print $2 }' "$fresh")
            base_kb=$(awk -v n="$n" '$1 == n { print $2 }' "$baseline")
            if [ -z "$fresh_kb" ] || [ -z "$base_kb" ]; then
              echo "N=$n: missing from fresh or baseline; not compared" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            pct=$(( (fresh_kb - base_kb) * 100 / base_kb ))
            echo "N=$n: fresh ${fresh_kb} KB vs baseline ${base_kb} KB (${pct}%)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$pct" -gt 35 ] || [ "$pct" -lt -35 ]; then
              echo "::warning::Allocation at N=$n deviates ${pct}% from the $baseline_dir baseline (fresh ${fresh_kb} KB vs ${base_kb} KB). Repeated weekly warnings mean: capture a fresh baseline and investigate."
            fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-perf-${{ github.run_id }}
          path: load-tests/target/memory-results-*.txt
          if-no-files-found: warn
