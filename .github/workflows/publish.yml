name: Publish to Maven Central

on:
  release:
    types: [ created ]
  # Resume a release that did not publish. A deploy can fail with the bundle already uploaded —
  # Central's validation is occasionally slow rather than stuck — and without this the only way to
  # finish the release was to cut another tag. The deploy passes ignorePublishedComponents, so the
  # bundle leaves out every module Central already has and re-running is safe. A dispatch runs this
  # file as it is on the branch it is dispatched from and builds the source of `ref`, so a fix to
  # this workflow on main also finishes a release whose tag predates the fix.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or SHA to build and publish: the tag of the release being resumed. With modules=all and the tag of the latest release, the signed artifacts are attached to it too'
        required: true
      modules:
        description: 'Which modules to deploy: all, or a comma-separated subset of annotations,processor,ksp,bom,cli'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach signed artifacts to the GitHub release
    # The Maven every deploy below runs on, in place of the runner image's. The image's Maven became
    # 3.10 with its 20261004 release, and central-publishing-maven-plugin 0.11.0 cannot bundle under
    # it: it zipped Maven 3.10's maven-metadata-local.xml and _remote.repositories beside the
    # artifacts, and Central rejected the release ("Bundle has content that does NOT have a .pom
    # file"). Stay on 3.9 until a plugin release handles 3.10 (#945). The central-bundle job in
    # build.yml reads both values from here and builds every module's bundle with them on each pull
    # request.
    env:
      MAVEN_VERSION: '3.9.16'
      # SHA-512 of apache-maven-<MAVEN_VERSION>-bin.tar.gz, the value Apache publishes beside it.
      MAVEN_SHA512: '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a release event, which keeps the default checkout of the tag.
          ref: ${{ github.event.inputs.ref || '' }}

      # `all` on a release event. A module repo1.maven.org already serves at this version is left
      # out: it is published, Central would reject it a second time, and a resume of a release that
      # published but was never marked Latest would otherwise build a bundle with nothing in it. What
      # is left becomes a Maven -pl list of artifactIds, which keeps the one-deployment shape for a
      # subset too, or no list when it is every module.
      #
      # SELECTED arrives through env, never through ${{ }} inside the script. An expression
      # interpolated into `run:` is substituted into the script *text* before bash sees it, so a
      # dispatch input of `all"; …; "` would execute as commands — in the one job that holds the
      # GPG private key, its passphrase and the Central token. Dispatching needs write access, so
      # this is defence in depth rather than an open door, but the blast radius is the project's
      # publishing identity and the safe form costs nothing.
      - name: Resolve which modules to deploy
        id: selection
        env:
          SELECTED: ${{ github.event.inputs.modules || 'all' }}
        run: |
          case "$SELECTED" in
            *[!a-z,]*) echo "::error::modules must be 'all' or a comma-separated subset of annotations,processor,ksp,bom,cli"; exit 1 ;;
          esac
          echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
          version="$(sed -n 's|^ *<revision>\([^<]*\)</revision>.*|\1|p' vibetags-parent/pom.xml)"
          if [ -z "$version" ]; then
            echo "::error::cannot read <revision> from vibetags-parent/pom.xml"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          wanted=""
          pending=""
          for m in annotations processor ksp bom cli; do
            if [ "$SELECTED" = "all" ] || echo ",$SELECTED," | grep -q ",$m,"; then
              wanted="${wanted:+$wanted,}$m"
              pom="https://repo1.maven.org/maven2/se/deversity/vibetags/vibetags-$m/$version/vibetags-$m-$version.pom"
              if [ "$(curl -s -o /dev/null -w '%{http_code}' "$pom")" = "200" ]; then
                echo "vibetags-$m $version is already on Maven Central; not deploying it again."
              else
                pending="${pending:+$pending,}$m"
              fi
            fi
          done
          if [ -z "$wanted" ]; then
            echo "::error::'$SELECTED' names none of annotations,processor,ksp,bom,cli"; exit 1
          fi
          projects=""
          if [ "$pending" = "annotations,processor,ksp,bom,cli" ]; then
            echo "built_all=true" >> "$GITHUB_OUTPUT"
          else
            for m in ${pending//,/ }; do
              projects="${projects:+$projects,}:vibetags-$m"
            done
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "deploy=$([ -n "$pending" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${pending:-nothing; every selected module is already on Maven Central}"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD

      # Inline, not a script: a resumed release checks out the tag it resumes, and that tag can
      # predate any script added for this. The central-bundle job in build.yml runs the same block,
      # which PublishMavenPinWiringTest checks.
      - name: Install the pinned Maven
        run: |
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/${archive}"
          echo "${MAVEN_SHA512}  $RUNNER_TEMP/$archive" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Before anything is signed or uploaded. A deploy on another Maven is the failure the pin
      # exists to prevent, so this refuses to start one rather than trusting the PATH.
      - name: Refuse to deploy on any Maven but the pinned one
        run: |
          version="$(mvn --version)"
          printf '%s\n' "$version"
          case "$version" in
            "Apache Maven ${MAVEN_VERSION} "*) ;;
            *) echo "::error::mvn on PATH is not Maven ${MAVEN_VERSION}; not deploying with it"; exit 1 ;;
          esac

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --list-keys --keyid-format LONG
        env:
          GPG_TTY: /dev/tty

      # One Central deployment for the whole release (#863). Central counts each published
      # deployment against the organization's monthly allowance of 7 releases, and deploying one
      # module at a time made a vibetags version cost 5: October 2026's release took the org from 1 to 6. The release
      # reactor in .github/central-release builds every module in one Maven invocation;
      # central-publishing-maven-plugin defers each module's files and uploads a single bundle after
      # the last, so a version costs 1, and Central publishes all of it or none of it rather than
      # leaving the first modules public when a later one fails validation. The reactor's module
      # order keeps the BOM ahead of the CLI. ignorePublishedComponents leaves out of the bundle any
      # module Central already has, so a resumed release does not fail on it. Tests are skipped: the
      # release commit passed every one on every JDK before it was tagged.
      - name: Sign and deploy every module to Maven Central as one deployment
        if: steps.selection.outputs.deploy == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PROJECTS: ${{ steps.selection.outputs.projects }}
        run: |
          bash .github/scripts/deploy-to-central.sh .github/central-release vibetags \
            -DskipTests -DignorePublishedComponents=true ${PROJECTS:+-pl "$PROJECTS"} \
            -Dgpg.passphrase="$GPG_PASSPHRASE"

      # The plugin returns once the Portal reports the deployment PUBLISHED; repo1.maven.org serves
      # the files some minutes later, and repo1 is what a consumer's build resolves from. Every
      # module, not only the ones this run deployed: the next step tells the world the version is
      # usable.
      - name: Wait until Maven Central serves every module
        env:
          VERSION: ${{ steps.selection.outputs.version }}
        run: |
          deadline=$(( $(date +%s) + 3600 ))
          for m in annotations processor ksp bom cli; do
            pom="https://repo1.maven.org/maven2/se/deversity/vibetags/vibetags-$m/$VERSION/vibetags-$m-$VERSION.pom"
            until [ "$(curl -s -o /dev/null -w '%{http_code}' "$pom")" = "200" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::vibetags-$m $VERSION is not on repo1.maven.org after an hour, so the release is not marked Latest. Once it resolves, finish with: gh workflow run publish.yml --ref main -f ref=<tag> -f modules=all"
                exit 1
              fi
              sleep 30
            done
            echo "vibetags-$m $VERSION: served by repo1.maven.org"
          done

      # The release skill creates the release with --latest=false, so the release page never
      # advertises a version consumers cannot resolve (#946). It becomes Latest here, once every
      # module answers on repo1. A resume marks its release only when it is the newest one, so
      # finishing an old release never takes Latest away from a newer one; a prerelease is never
      # marked. EVENT, RELEASE_TAG and REF arrive through env for the reason at "Resolve which
      # modules".
      - name: Mark the release Latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          if [ "$EVENT" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            newest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
            if [ "$newest" != "$REF" ]; then
              echo "Not marking: '$REF' is not the newest release ('$newest')."
              exit 0
            fi
            tag="$REF"
          fi
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            echo "Not marking: $tag is a prerelease."
            exit 0
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          echo "Marked $tag as the Latest release."

      # Attach the GPG-signed jars/poms (and their .asc signatures) to the
      # GitHub release so Scorecard's Signed-Releases check can verify them.
      # A release event attaches to its own release. A resume attaches only when it built every
      # module, so every target/ directory below exists, and only when `ref` is the tag of the
      # latest release: the action updates the release it attaches to without passing
      # make_latest, GitHub's update defaults that to true, and the action creates a release for a
      # tag that has none. REF arrives through env for the reason given at "Resolve which modules".
      - name: Find the release to attach the signed artifacts to
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.event.inputs.ref }}
          SELECTED: ${{ steps.selection.outputs.selected }}
          BUILT_ALL: ${{ steps.selection.outputs.built_all }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$BUILT_ALL" != "true" ]; then
            echo "Not attaching: this run did not build every module ('$SELECTED' selected, the rest already on Central), so not every module's jars exist."
          elif [ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$REF" ]; then
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
            echo "Attaching to the release for $REF, the latest release."
          else
            echo "Not attaching: '$REF' is not the tag of the latest release. Upload its assets with gh release upload."
          fi

      - name: Attach signed artifacts to the GitHub release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            vibetags-annotations/target/*.jar
            vibetags-annotations/target/*.jar.asc
            vibetags/target/*.jar
            vibetags/target/*.jar.asc
            vibetags-cli/target/*.jar
            vibetags-cli/target/*.jar.asc
            vibetags-ksp/target/*.jar
            vibetags-ksp/target/*.jar.asc
            vibetags-bom/target/*.pom.asc
