repos:
- repo: https://github.com/gherynos/pre-commit-java
  rev: v0.2.4
  hooks:
  - id: checkstyle
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # The code-karta SVGs under docs/diagrams/codekarta/ are generator output, byte for byte,
  # and the benchmark logs under load-tests/results/ are frozen measurement records.
  # Letting these hooks reformat either would leave the committed file permanently different
  # from what the generator or the benchmark harness actually emitted, so every regeneration
  # would show up as a diff nobody made.
  - id: end-of-file-fixer
    exclude: ^(docs/diagrams/codekarta/|load-tests/results/)
  - id: trailing-whitespace
    exclude: ^(docs/diagrams/codekarta/|load-tests/results/)
# The CI self-check, run before the commit instead of after the push. A line added above a
# locked method moves its recorded range in .vibetags-locks, and a regeneration can move the
# line counts README.md quotes; both used to surface only as a red build.yml job. 30-45 s,
# so it runs only when a commit touches what feeds the generated files (and on --all-files).
- repo: local
  hooks:
  - id: vibetags-self-check
    name: VibeTags' own guardrails are current (tools/self-check.sh)
    entry: tools/self-check.sh
    language: script
    pass_filenames: false
    files: ^(vibetags/src/|vibetags-annotations/src/|vibetags/pom\.xml$|README\.md$)
