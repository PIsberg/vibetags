repos:
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # The code-karta SVGs under docs/diagrams/codekarta/ are generator output, byte for byte,
  # and the benchmark logs under load-tests/results/ are frozen measurement records.
  # Letting these hooks reformat either would leave the committed file permanently different
  # from what the generator or the benchmark harness actually emitted, so every regeneration
  # would show up as a diff nobody made.
  - id: end-of-file-fixer
    exclude: ^(docs/diagrams/codekarta/|load-tests/results/)
  - id: trailing-whitespace
    # A unified diff marks a blank context line with a single space; stripping it corrupts the
    # consumer eval's held/violated patches.
    exclude: ^(docs/diagrams/codekarta/|load-tests/results/)|\.patch$
# The CI self-check, run before the commit instead of after the push. A line added above a
# locked method moves its recorded range in .vibetags-locks, and a regeneration can move the
# line counts README.md quotes; both used to surface only as a red build.yml job. 30-45 s,
# so it runs only when a commit touches what feeds the generated files (and on --all-files).
# It runs as a git `!` alias, not as `language: script` or `bash ...`: both of those find bash
# through PATH, and from PowerShell or cmd on Windows that is the WSL launcher, which reads the
# backslashed script path as escapes and exits 127 before the script starts (#905). Git runs
# `!` aliases with its own shell on every platform, from the repository root.
- repo: local
  hooks:
  - id: vibetags-self-check
    name: VibeTags' own guardrails are current (tools/self-check.sh)
    entry: git -c "alias.vibetags-self-check=!bash tools/self-check.sh" vibetags-self-check
    language: system
    pass_filenames: false
    files: ^(vibetags/src/|vibetags-annotations/src/|vibetags/pom\.xml$|README\.md$)
# Checkstyle as the build runs it: maven-checkstyle-plugin in each module a staged .java file
# belongs to, so the ruleset, suppressions and Checkstyle version are the ones CI applies. Same git
# `!` alias as above, for the same Windows reason (#905). It replaced gherynos/pre-commit-java,
# which ran Sun's default ruleset rather than checkstyle.xml and could not run on Windows (#982).
  - id: checkstyle
    name: Checkstyle with the build's own configuration (tools/checkstyle-hook.sh)
    entry: git -c "alias.vibetags-checkstyle=!bash tools/checkstyle-hook.sh" vibetags-checkstyle
    language: system
    files: \.java$
    require_serial: true
