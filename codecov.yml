codecov:
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # `auto` compares against the base commit rather than a number written here, so the
        # gate is "this pull request may not lose coverage" rather than "coverage may fall to
        # the floor somebody typed in 2026". The fixed 90% it replaced had drifted into slack: a
        # 90% target with a 2% threshold only fails below 88%, and measured coverage has been
        # above 92% since #476, so a change could shed four points and still pass. See
        # docs/TESTS.md, "Coverage and the fault paths", for what the remaining uncovered lines
        # are and why they are not reachable from a test (#482).
        target: auto
        threshold: 1%
    patch:
      default:
        # Informational: the blocking check on the coverage of new code is the
        # quality gate in build-maven (tools/quality-gate), which counts only the
        # lines JaCoCo reports as executable. The project status above is the
        # "may not lose coverage" gate (target auto, 1% threshold); the fixed 90%
        # floor this comment used to cite was replaced by it.
        informational: true

ignore:
  - "vibetags-bom/"
  - "examples/basic/"
  - "load-tests/"
