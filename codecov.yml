codecov:
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # `auto` compares against the base commit rather than a number written here, so the
        # gate is "this pull request may not lose coverage" rather than "coverage may fall to
        # the floor somebody typed in 2026". The fixed 90% it replaced had drifted into slack:
        # measured coverage was well above it, so a change could shed several points and still
        # pass. See docs/TESTS.md, "Coverage and the fault paths", for what the remaining
        # uncovered lines are and why they are not reachable from a test (#482).
        target: auto
        threshold: 1%
    patch:
      default:
        # @SuppressWarnings annotations have RetentionPolicy.SOURCE — they are
        # stripped from bytecode so JaCoCo never records coverage for those lines.
        # On PMD-suppression commits every @SuppressWarnings in the diff counts as
        # an uncovered line, making patch coverage misleading. Keep patch coverage
        # as informational (reported but non-blocking); project-level target still
        # enforces the 90% floor on overall coverage.
        informational: true

ignore:
  - "vibetags-bom/"
  - "examples/basic/"
  - "load-tests/"
