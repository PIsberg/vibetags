plugins {
    id 'java'
}

group = 'se.deversity.vibetags.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // BOM is the single source of truth for vibetags-* versions. Apply it to both the
    // compile and annotation-processor configurations so neither needs an explicit version.
    implementation platform('se.deversity.vibetags:vibetags-bom:1.3.7')
    annotationProcessor platform('se.deversity.vibetags:vibetags-bom:1.3.7')

    // Annotations on compile, processor on the annotation-processor path only —
    // keeps the processor's slf4j/logback off the consumer's compile classpath.
    compileOnly 'se.deversity.vibetags:vibetags-annotations'
    annotationProcessor 'se.deversity.vibetags:vibetags-processor'

    // The test source set is what makes VibeTags write TESTING.md, so the processor has to run
    // over it as well. Gradle gives a test source set neither the main set's compileOnly
    // dependencies nor its annotation-processor path, so both are declared again here; without
    // them the test sources would not compile, and if they did the processor would never see them.
    testCompileOnly 'se.deversity.vibetags:vibetags-annotations'
    testAnnotationProcessor platform('se.deversity.vibetags:vibetags-bom:1.3.7')
    testAnnotationProcessor 'se.deversity.vibetags:vibetags-processor'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava {
    options.annotationProcessorPath = configurations.annotationProcessor
}

compileTestJava {
    options.annotationProcessorPath = configurations.testAnnotationProcessor
}

// One list of processor options for both source sets. A difference between them would be a
// difference in what VibeTags is told, not a build-script detail, and the main round would be the
// only one anybody noticed.
[compileJava, compileTestJava].each { compileTask ->
    compileTask.options.compilerArgs << "-Avibetags.root=${projectDir.absolutePath}"
    if (project.hasProperty('compilerArgs')) {
        compileTask.options.compilerArgs.addAll(project.getProperty('compilerArgs').split(' '))
    }
}

// The test sources here are annotated classes for the processor to read, not tests to run, and
// the example deliberately declares no test framework. `build` would otherwise reach a `test`
// task with classes and nothing to run them with.
test {
    enabled = false
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.example.MainApplication'
        )
    }
}

// Optional: Run the application
task runApp(type: JavaExec) {
    group = 'application'
    description = 'Run the VibeTags example application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.MainApplication'
}
