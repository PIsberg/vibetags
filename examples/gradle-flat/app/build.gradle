// The VibeTags root is the directory ABOVE the Gradle root, because that is the only
// directory that contains both modules. Pointing it at rootProject.projectDir (app/) would
// leave lib/ outside the root: see ../README.md for what that costs.
def vibetagsRoot = rootProject.projectDir.parentFile.absolutePath

allprojects {
    apply plugin: 'java'

    group = 'se.deversity.vibetags.example'
    version = '1.0.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation platform('se.deversity.vibetags:vibetags-bom:1.2.5')
        annotationProcessor platform('se.deversity.vibetags:vibetags-bom:1.2.5')
        compileOnly 'se.deversity.vibetags:vibetags-annotations'
        annotationProcessor 'se.deversity.vibetags:vibetags-processor'
    }

    // Name the module explicitly rather than letting the root project inherit its
    // settings.gradle name, which would put "vibetags-example-gradle-flat" in the shared file
    // next to a plain "lib". ../gradle-composite makes the same choice for the same reason, and
    // two adjacent examples demonstrating one option with opposite conventions is a trap for
    // whoever reads them side by side (issue #449).
    def vibetagsModule = project == rootProject ? "app" : project.name

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Avibetags.root=${vibetagsRoot}"
        options.compilerArgs << "-Avibetags.module=${vibetagsModule}"
    }
}
