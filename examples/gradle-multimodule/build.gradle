// Root project: configuration only, no sources of its own. This is the shape most Gradle
// reactors have, and the one the Maven examples already cover on the Maven side.
subprojects {
    apply plugin: 'java'

    group = 'se.deversity.vibetags.example'
    version = '1.0.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation platform('se.deversity.vibetags:vibetags-bom:1.2.4')
        annotationProcessor platform('se.deversity.vibetags:vibetags-bom:1.2.4')
        compileOnly 'se.deversity.vibetags:vibetags-annotations'
        annotationProcessor 'se.deversity.vibetags:vibetags-processor'
    }

    tasks.withType(JavaCompile).configureEach {
        // Every subproject compiles in its own Gradle worker directory, so the reactor root
        // has to be named explicitly. Pointing every module at rootProject.projectDir is what
        // makes the modules aggregate into one set of generated files instead of each writing
        // its own. rootProject, not projectDir: projectDir would give each module its own root.
        options.compilerArgs << "-Avibetags.root=${rootProject.projectDir.absolutePath}"
    }
}
