// Root project: configuration only, no sources of its own. This is the shape most Gradle
// reactors have, and the one the Maven examples already cover on the Maven side.
subprojects {
    apply plugin: 'java'

    group = 'se.deversity.vibetags.example'
    version = '1.0.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation platform('se.deversity.vibetags:vibetags-bom:1.3.0')
        annotationProcessor platform('se.deversity.vibetags:vibetags-bom:1.3.0')
        compileOnly 'se.deversity.vibetags:vibetags-annotations'
        annotationProcessor 'se.deversity.vibetags:vibetags-processor'
    }

    tasks.withType(JavaCompile).configureEach {
        // Every subproject compiles in its own Gradle worker directory, so the reactor root
        // has to be named explicitly. Pointing every module at rootProject.projectDir is what
        // makes the modules aggregate into one set of generated files instead of each writing
        // its own. rootProject, not projectDir: projectDir would give each module its own root.
        options.compilerArgs << "-Avibetags.root=${rootProject.projectDir.absolutePath}"

        // Check mode: fail the build when the committed guardrail files no longer match the
        // annotations, instead of rewriting them. Opt in per invocation:
        //
        //     ./gradlew build -PvibetagsCheck
        //
        // upToDateWhen { false } is the load-bearing half. Check mode runs inside the annotation
        // processor, so it only runs if javac runs, and Gradle skips an UP-TO-DATE compileJava.
        // Without this line a second invocation on an unchanged tree skips compilation entirely
        // and the check "passes" having verified nothing, which is the failure a verification gate
        // can least afford. Maven has no equivalent hazard: its check-mode profile binds to a
        // lifecycle phase that always recompiles.
        if (project.hasProperty('vibetagsCheck')) {
            options.compilerArgs << "-Avibetags.check=true"
            outputs.upToDateWhen { false }
        }
    }
}
