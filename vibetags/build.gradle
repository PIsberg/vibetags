plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'pmd'
}

// Shared dependency versions live in vibetags-parent/pom.xml and are read from it rather than
// repeated here. Gradle cannot inherit from a POM, so the numbers used to be copied by hand and
// BuildVersionParityTest was the only thing that noticed when a copy went stale. It noticed often:
// .github/dependabot.yml has no gradle ecosystem, so every Maven bump of a coordinate that also
// appears below arrived as a red Gradle job until somebody edited this file too. Reading the same
// file removes the second copy instead of guarding it.
def parentPomText = file('../vibetags-parent/pom.xml').getText('UTF-8')
def parentPomProperties = { ->
    int start = parentPomText.indexOf('<properties>')
    int end = parentPomText.indexOf('</properties>', start)
    if (start < 0 || end <= start) {
        throw new GradleException('vibetags-parent/pom.xml has no <properties> block, so there is '
            + 'nothing to read versions from.')
    }
    def found = [:]
    def matcher = (parentPomText.substring(start, end) =~ /<([A-Za-z0-9._-]+)>([^<>]*)<\/\1>/)
    matcher.each { match -> found[match[1]] = match[2].trim() }
    found
}()
def pomVersion = { String property ->
    def value = parentPomProperties[property]
    if (!value) {
        throw new GradleException("vibetags-parent/pom.xml <properties> does not define <"
            + property + ">. Maven is the single source for shared versions: add the property "
            + 'there rather than hard-coding a number in build.gradle.')
    }
    value
}

group = 'se.deversity.vibetags'
version = '1.3.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'se.deversity.vibetags'
            artifactId = 'vibetags-processor'
            version = '1.3.1'
            from components.java

            pom {
                name = 'VibeTags Processor'
                description = 'Java annotation processor that generates AI platform-specific guardrail configuration files at compile time.'
                url = 'https://github.com/PIsberg/vibetags'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'PIsberg'
                        name = 'Peter Isberg'
                        url = 'https://github.com/PIsberg'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/PIsberg/vibetags.git'
                    developerConnection = 'scm:git:ssh://github.com/PIsberg/vibetags.git'
                    url = 'https://github.com/PIsberg/vibetags/tree/main'
                }
            }
        }
    }

    repositories {
        // GitHub Packages
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/PIsberg/vibetags')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
        // Maven Central releases do NOT go through this Gradle publication.
        // The canonical release path is the Maven `publish` workflow (central-publishing-maven-plugin);
        // see docs/RELEASING.md. This block previously pointed at the decommissioned
        // OSSRH host (s01.oss.sonatype.org, shut down mid-2025) and was removed.
    }
}

repositories {
    // mavenLocal first: the CI step that builds vibetags-annotations publishes it
    // to ~/.m2/repository before this module is built, so that's where Gradle finds
    // the un-released version. mavenCentral handles released versions of everything else.
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Annotation classes the processor scans for; backwards-compatible transitive
    // dep so existing consumers still get the annotations via vibetags-processor.
    api 'se.deversity.vibetags:vibetags-annotations:1.3.1'

    // JSpecify null annotations (@NullMarked, @Nullable, @NonNull)
    implementation "org.jspecify:jspecify:${pomVersion('jspecify.version')}"

    // Logging: SLF4J API + Logback file appender for vibetags.log
    implementation "org.slf4j:slf4j-api:${pomVersion('slf4j.version')}"
    implementation "ch.qos.logback:logback-classic:${pomVersion('logback.version')}"

    testImplementation "com.tngtech.archunit:archunit-junit5:${pomVersion('archunit.version')}"
    testImplementation "org.junit.jupiter:junit-jupiter:${pomVersion('junit.version')}"
    // Concurrency-test harness, matching pom.xml. Resolves from Maven Central like any other dep.
    testImplementation "se.deversity.async-test-lib:async-test-lib:${pomVersion('async-test-lib.version')}"
    testImplementation "org.mockito:mockito-core:${pomVersion('mockito.version')}"
    testImplementation "org.mockito:mockito-junit-jupiter:${pomVersion('mockito.version')}"
    // Test-only, matching pom.xml. The processor writes six YAML documents but must not gain a
    // YAML dependency: it runs on the consumer's annotation-processor path, where every extra jar
    // is one more thing to collide with. The tests need a real parser because "the file looks
    // right" is not the property that matters - "the tool reading it sees every module's
    // guardrails" is, and only a parser shows that.
    testImplementation "org.yaml:snakeyaml:${pomVersion('snakeyaml.version')}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            // Stable JPMS module name for modular consumers; changing it after 1.0 is breaking.
            'Automatic-Module-Name': 'se.deversity.vibetags.processor',
            // Feeds ProcessorVersion → BuildFingerprint so a processor upgrade
            // invalidates stale .vibetags-cache fingerprints.
            'Implementation-Title': 'vibetags-processor',
            'Implementation-Version': version
        )
    }
}

compileJava {
    // Disable annotation processing when compiling the processor itself
    options.compilerArgs += ['-proc:none']
}


// Mirrors the Maven split in vibetags/pom.xml: `gradle test` skips the @Tag("e2e")
// classes so the local loop stays fast, and -Pe2e adds them back. The two build
// systems have to agree — if this block and the pom's <excludedGroups> drift, one of
// them silently stops running 52 test classes. TestTagVocabularyTest pins the tag name
// in both files; nothing else does, so change them together.
test {
    useJUnitPlatform()
    jvmArgs "-Dnet.bytebuddy.experimental=true", "-Dlicense.mock.mode=true"
    finalizedBy jacocoTestReport
}

// Applied here rather than in the useJUnitPlatform block above because --tests is a task
// option: it is parsed after the project is evaluated, so commandLineIncludePatterns is
// still empty while build.gradle is being read. Naming a test has to win over the tag
// filter — otherwise `gradlew test --tests '*WriteCacheProcessorIntegrationTest'` prints
// BUILD SUCCESSFUL having run nothing, which is the same silent-green trap the Maven side
// avoids with the named-test-overrides-tags profile.
gradle.taskGraph.whenReady {
    boolean namedATest = !test.filter.commandLineIncludePatterns.isEmpty()
    if (!project.hasProperty("e2e") && !namedATest) {
        test.options {
            excludeTags "e2e"
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

pmd {
    consoleOutput = true
    // Derived, never a literal. A literal here is a mirror of pmd.version in the parent, and
    // dependabot bumps the parent alone - so every PMD bump arrived as a red
    // BuildVersionParityTest that a human had to hand-fix before the PR could merge.
    toolVersion = pomVersion('pmd.version')
    ignoreFailures = false
    ruleSetFiles = files("${projectDir}/../pmd-ruleset.xml")
}

tasks.named('pmdTest') { enabled = false }
