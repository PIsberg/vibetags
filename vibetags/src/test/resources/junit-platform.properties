# Enable parallel test execution under JUnit Jupiter
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# Run tests on plain worker threads, not ForkJoinPool workers (#659). The processor's write phase
# blocks in ForkJoinTask.get() on a pool of its own; on a ForkJoinPool worker that call runs other
# queued tasks instead of parking, and under the default fork_join_pool executor those tasks are
# other tests. Tests then started inside unrelated tests' compilations on the same thread, nested
# up to 14 deep in one measured run, until javac overflowed the stack and returned false with no
# ERROR diagnostic. TestExecutorThreadTest fails if this line is removed.
junit.jupiter.execution.parallel.config.executor-service = worker_thread_pool
